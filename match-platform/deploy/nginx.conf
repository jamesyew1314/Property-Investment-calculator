# PropMatch nginx 示例（match.kwongthye.com）
# 1) 先 certbot --nginx -d match.kwongthye.com 申请证书
# 2) 将下方证书路径替换为 certbot 实际输出
# 3) nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name match.kwongthye.com;

    # ACME 续期
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name match.kwongthye.com;

    ssl_certificate     /etc/letsencrypt/live/match.kwongthye.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/match.kwongthye.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 仅允许正常页面体积（当前不支持照片上传；图片用 URL）
    client_max_body_size 2m;

    # 隐私：禁止索引
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/propmatch.access.log;
    error_log  /var/log/nginx/propmatch.error.log;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查可单独放行（如需外部监控不带 Cookie）
    location = /api/health {
        proxy_pass http://127.0.0.1:4100/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
