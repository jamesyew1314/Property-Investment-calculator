# PropMatch under the existing kwongthye.com HTTPS server
# Add this block inside the server { listen 443 ... server_name kwongthye.com ... } block,
# before the existing location /api/ { ... }.
# The app is path-aware (relative <base>, prefixed API calls), so no subdomain is needed.

    # ---- PropMatch 智能房源配对（Node 127.0.0.1:4100）----
    location = /match { return 301 /match/$is_args$args; }
    location ^~ /match/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /match;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 2m;
    }
