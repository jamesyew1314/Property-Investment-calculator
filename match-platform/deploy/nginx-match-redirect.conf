# Keep old /match/ links working after moving PropMatch to its own subdomain.
# Add this block inside the existing https://kwongthye.com HTTPS server,
# before the existing location /api/ { ... }.
# The actual app is served by deploy/nginx.conf (match.kwongthye.com -> 127.0.0.1:4100).

    # ---- PropMatch 已切到独立子域（/match/ 仅做 301）----
    location = /match { return 301 https://match.kwongthye.com/$is_args$args; }
    location ^~ /match/ { rewrite ^/match/(.*)$ https://match.kwongthye.com/$1 permanent; }
