name: Deploy to production

# 触发：push 到 main、或手动点 Run workflow
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "deliverables/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regression tests (53 assertions)
        run: node web/test.js

      # 需要三个仓库 Secret：
      #   SSH_HOST  47.254.235.22
      #   SSH_KEY   部署用私钥（建议单独生成一把，只用于部署）
      #   SSH_USER  root（可选，默认 root）
      - name: Prepare SSH
        id: ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -e
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=跳过部署::未配置 SSH_HOST / SSH_KEY，本次只跑测试，不部署。"
            exit 0
          fi
          mkdir -p ~/.ssh
          # 清洗：CRLF / 首尾空白 / 被转义成字面 \n 的情况
          printf '%s' "$SSH_KEY" | sed 's/\r$//' > /tmp/key.raw
          if ! grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw && grep -q '\\n' /tmp/key.raw; then
            sed 's/\\n/\n/g' /tmp/key.raw > ~/.ssh/deploy_key
          else
            cp /tmp/key.raw ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ready=false" > /tmp/ssh-info
            echo "reason=ssh_key_invalid" >> /tmp/ssh-info
            echo "len=${#SSH_KEY}" >> /tmp/ssh-info
            echo "head=$(printf '%s' "$SSH_KEY" | head -c 40)" >> /tmp/ssh-info
            echo "::warning title=SSH_KEY 无效::私钥格式不正确（可能粘贴不完整）。请重新复制并覆盖 SSH_KEY。"
            exit 0
          fi
          ssh-keygen -lf ~/.ssh/deploy_key | awk '{print "key fingerprint " $2}'
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "ready=true" > /tmp/ssh-info
          ssh-keygen -lf ~/.ssh/deploy_key >> /tmp/ssh-info 2>&1 || true
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.ssh.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -o pipefail
          KEY=~/.ssh/deploy_key HOST="$SSH_HOST" USER_="${SSH_USER:-root}" bash deploy/deploy.sh 2>&1 | tee /tmp/deploy.log

      - name: Upload deploy log
        if: always()
        run: |
          { [ -f /tmp/ssh-info ] && cat /tmp/ssh-info; echo "---deploy---"; [ -f /tmp/deploy.log ] && tail -40 /tmp/deploy.log || echo "deploy skipped"; } > .deploy-log
          git config user.name "deploy-bot"
          git config user.email "deploy@kwongthye.com"
          git add .deploy-log
          git commit -m "chore: deploy log" || true
          git push || true

      - name: Smoke test (public URL)
        if: steps.ssh.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://kwongthye.com/api/health || true)
            [ "$code" = "200" ] && break || sleep 3
          done
          echo "health HTTP $code"
          [ "$code" = "200" ] || exit 1
          curl -s https://kwongthye.com/api/health | grep -q '"ok":true'
          echo "✓ production healthy"
