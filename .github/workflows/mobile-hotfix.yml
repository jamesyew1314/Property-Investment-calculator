name: Mobile hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mobile-hotfix.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -u
          OUT=.deploy-status
          echo "run $(date -u +%FT%TZ)" > "$OUT"
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "missing SSH_HOST / SSH_KEY secrets" >> "$OUT"
          else
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_KEY" > ~/.ssh/k
            chmod 600 ~/.ssh/k
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            U="${SSH_USER:-root}"
            scp -i ~/.ssh/k -o StrictHostKeyChecking=no web/agent/app.js "$U@$SSH_HOST:/srv/fangchan/web/agent/app.js" >> "$OUT" 2>&1 && echo "app.js ok" >> "$OUT"
            scp -i ~/.ssh/k -o StrictHostKeyChecking=no web/agent/index.html "$U@$SSH_HOST:/srv/fangchan/web/agent/index.html" >> "$OUT" 2>&1 && echo "index ok" >> "$OUT"
            ssh -i ~/.ssh/k -o StrictHostKeyChecking=no "$U@$SSH_HOST" 'chown -R fangchan:fangchan /srv/fangchan/web/agent' >> "$OUT" 2>&1 && echo "chown ok" >> "$OUT"
            curl -s https://kwongthye.com/agent/ | grep -o 'app.js?v=[0-9a-z]*' >> "$OUT" 2>&1 || true
          fi
          git config user.name "deploy-bot"
          git config user.email "deploy@kwongthye.com"
          git add "$OUT"
          git commit -m "chore: deploy status $(date -u +%H%M%S)" || true
          git push || true
