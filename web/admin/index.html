<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>管理后台 Admin — KWONG THYE</title>
<link rel="icon" type="image/png" href="/icon-256.png">
<style>
  :root{--navy:#0E2438;--gold:#C6A15B;--cream:#F6F7FB;--ink:#1B2430;--muted:#5D6B7A;--line:#E2E6EE;--blue:#2E5496}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{background:var(--navy);color:#fff}
  .wrap{width:min(1080px,94vw);margin:0 auto}
  .bar{display:flex;align-items:center;gap:10px;height:64px}
  .bar img{height:38px}
  .bar b{font-family:Georgia,serif;font-size:16px}
  .bar .sp{margin-left:auto}
  .bar button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  #langBtn{font-weight:700;min-width:52px}
  main{padding:26px 0 60px}
  h1{font-size:20px;margin:0 0 16px;color:var(--navy)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .login{max-width:420px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
  .login h2{margin:0 0 6px;color:var(--navy);font-size:18px}
  .login p{margin:0 0 16px;color:var(--muted);font-size:12.5px}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid #D6DCE7;border-radius:9px;font:inherit;font-size:14px;background:#FCFDFF}
  label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:999px;padding:10px 18px;font-size:13.5px;cursor:pointer;font-weight:600;font-family:inherit}
  .btn.gold{background:var(--gold);color:#1B2430}
  .btn.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat b{display:block;font-family:Georgia,serif;font-size:20px;color:var(--navy)}
  .stat span{font-size:11px;color:var(--muted)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tab{display:none}
  .tab.on{display:block}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  th,td{border-bottom:1px solid #EEF1F6;padding:8px 8px;text-align:left;vertical-align:top}
  th{background:#F8FAFD;color:var(--navy);font-size:11.5px;position:sticky;top:0}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .codes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .code{background:#F3F7FF;border:1px dashed #B9C8E4;border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:13px;display:flex;gap:8px;align-items:center}
  .code button{border:none;background:none;color:var(--blue);cursor:pointer;font-size:11px;font-family:inherit}
  .msg{font-size:12.5px;margin-top:10px}
  .msg.err{color:#B23B3B}.msg.ok{color:#166E52}
  .muted{color:var(--muted);font-size:11.5px}
  .tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;background:#EEF2F8;color:#456}
  .tag.pro{background:#EAF6EF;color:#166E52}
  .charts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 18px}
  .chart{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .chartHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .chartHead b{font-size:12.5px;color:var(--navy)}
  .bars{display:flex;flex-direction:column;gap:3px}
  .barRow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
  .barRow .d{flex:0 0 46px;font-variant-numeric:tabular-nums}
  .barRow .track{flex:1 1 auto;background:#F1F4F9;border-radius:4px;height:9px;overflow:hidden}
  .barRow .fill{height:9px;background:linear-gradient(90deg,#2E5496,#0E2438);border-radius:4px}
  .barRow .fill.gold{background:linear-gradient(90deg,#E3C98F,#C6A15B)}
  .barRow .v{flex:0 0 54px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  @media(max-width:820px){.charts{grid-template-columns:1fr}}
  .exportBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
  .exportBar .btn{padding:6px 14px;font-size:12px;text-decoration:none;display:inline-block}
  @media(max-width:820px){.stats{grid-template-columns:repeat(3,1fr)}.grid,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a href="/"><img src="/logo-white.png" alt="KWONG THYE"></a>
    <b><span data-i18n="adminTitle">管理后台</span> <span style="color:#C6A15B;font-size:12px">Admin</span></b>
    <span class="sp"></span>
    <span id="who" hidden style="color:#8FE3B0;font-size:12px;margin-right:6px" data-i18n="signedIn">● 已登录</span>
    <span id="roleTag" hidden class="tag" style="margin-right:8px"></span>
    <a href="/library/" style="color:#C6A15B;border:1px solid rgba(198,161,91,.55);border-radius:999px;padding:6px 12px;font-size:12px;text-decoration:none;margin-right:6px;white-space:nowrap">资料库 Library</a>
    <button id="langBtn">EN</button>
    <button id="pwdBtn" hidden style="margin-right:4px" data-i18n="changePwd">修改密码</button>
    <button id="logoutBtn" hidden data-i18n="logout">退出</button>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="login" id="loginBox">
      <h2 data-i18n="loginTitle">管理员登录</h2>
      <p data-i18n="loginNote">仅限内部使用。密码与用户账号无关。登录状态保持 2 小时，退出后需重新验证。</p>
      <label data-i18n="lblAdminEmail">管理员邮箱（owner 留空）</label>
      <input id="admEmail" type="email" autocomplete="username" placeholder="admin@example.com">
      <label style="margin-top:10px" data-i18n="lblPassword">密码</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="loginBtn" style="margin-top:12px;width:100%" data-i18n="btnLogin">登录</button>
      <div id="otpWrap" hidden style="margin-top:14px">
        <label data-i18n="lblOtp">邮箱验证码（6 位）</label>
        <input id="otp" class="mono" inputmode="numeric" maxlength="6" placeholder="123456">
        <button class="btn gold" id="verifyBtn" style="margin-top:10px;width:100%" data-i18n="btnVerify">验证并进入</button>
        <p class="muted" style="margin:8px 0 0" data-i18n="otpNote">验证码已发到管理员邮箱，10 分钟内有效。</p>
      </div>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div id="app" hidden>
      <div style="display:flex;align-items:baseline;gap:10px;margin:0 0 14px">
        <h1 style="margin:0" data-i18n="overview">后台概览</h1>
        <span class="muted" id="whoLine"></span>
      </div>
      <div class="stats" id="stats"></div>

      <div class="charts">
        <div class="chart">
          <div class="chartHead"><b data-i18n="chRevenue">近 14 天收入</b><span class="muted" id="chRevSum"></span></div>
          <div class="bars" id="chRev"></div>
        </div>
        <div class="chart">
          <div class="chartHead"><b data-i18n="chUsers">近 14 天新用户</b><span class="muted" id="chUserSum"></span></div>
          <div class="bars" id="chUsers"></div>
        </div>
        <div class="chart">
          <div class="chartHead"><b data-i18n="chViews">近 14 天浏览量</b><span class="muted" id="chViewSum"></span></div>
          <div class="bars" id="chViews"></div>
        </div>
      </div>

      <div class="tabs">
        <button data-tab="codes" class="on" data-i18n="tabCodes">生成开通码</button>
        <button data-tab="promo" data-i18n="tabPromo">优惠码</button>
        <button data-tab="list" data-i18n="tabList">码列表</button>
        <button data-tab="users" data-i18n="tabUsers">用户</button>
        <button data-tab="msgs" data-i18n="tabMsgs">留言</button>
        <button data-tab="views" data-i18n="tabViews">访问量</button>
        <button data-tab="refunds" data-i18n="tabRefunds">退款</button>
        <button data-tab="logs" data-i18n="tabLogs">操作日志</button>
        <button data-tab="admins" id="tabBtnAdmins" hidden data-i18n="tabAdmins">管理员</button>
      </div>

      <div class="exportBar">
        <span class="muted" data-i18n="exportLbl">导出 CSV：</span>
        <a class="btn ghost" href="/api/admin/export/users.csv" data-i18n="expUsers">用户</a>
        <a class="btn ghost" href="/api/admin/export/codes.csv" data-i18n="expCodes">开通码</a>
        <a class="btn ghost" href="/api/admin/export/payments.csv" data-i18n="expPayments">收据</a>
      </div>

      <section class="tab on" id="tab-codes">
        <div class="card">
          <div class="grid3">
            <div><label data-i18n="lblDays">天数</label><select id="cDays">
              <option value="30" data-i18n="opt30">30 天（月付）</option>
              <option value="365" data-i18n="opt365">365 天（年付）</option>
              <option value="90" data-i18n="opt90">90 天</option>
              <option value="180" data-i18n="opt180">180 天</option>
            </select></div>
            <div><label data-i18n="lblCount">数量</label><input id="cCount" type="number" min="1" max="50" value="1"></div>
            <div><label data-i18n="lblAmountAuto">金额 RM（留空自动）</label><input id="cAmount" type="number" step="0.01" data-i18n-ph="phAuto" placeholder="自动"></div>
          </div>
          <div style="margin-top:12px"><label data-i18n="lblNoteOpt">备注（可选）</label><input id="cNote" maxlength="120" data-i18n-ph="phNote" placeholder="例：10 月促销 / 客户姓名"></div>
          <button class="btn gold" id="genBtn" style="margin-top:14px" data-i18n="btnGenerate">生成</button>
          <div class="codes" id="genOut"></div>
          <div class="msg" id="genMsg"></div>
        </div>
      </section>

      <section class="tab" id="tab-promo">
        <div class="card">
          <div class="grid">
            <div><label data-i18n="lblPromoCode">优惠码（自定义）</label><input id="pCode" class="mono" placeholder="EARLY79"></div>
            <div><label data-i18n="lblDays2">天数</label><input id="pDays" type="number" value="365"></div>
            <div><label data-i18n="lblMaxUses">最多使用次数</label><input id="pMax" type="number" value="10"></div>
            <div><label data-i18n="lblAmount">金额 RM</label><input id="pAmount" type="number" step="0.01" value="79"></div>
            <div><label data-i18n="lblExpiry">有效期（天，留空永久）</label><input id="pExp" type="number" placeholder="30"></div>
            <div><label data-i18n="lblNote">备注</label><input id="pNote" maxlength="120" data-i18n-ph="phPromoNote" placeholder="早鸟年付"></div>
          </div>
          <button class="btn gold" id="promoBtn" style="margin-top:14px" data-i18n="btnCreatePromo">创建优惠码</button>
          <div class="msg" id="promoMsg"></div>
        </div>
      </section>

      <section class="tab" id="tab-list">
        <div class="card" style="padding:0;overflow:auto;max-height:70vh">
          <table><thead><tr>
            <th data-i18n="thCode">码</th><th data-i18n="thDays">天</th><th data-i18n="thAmount">金额</th>
            <th data-i18n="thUsed">已用</th><th data-i18n="thType">类型</th><th data-i18n="thNote">备注</th><th data-i18n="thCreated">创建</th>
          </tr></thead><tbody id="listBody"></tbody></table>
        </div>
      </section>

      <section class="tab" id="tab-users">
        <div class="card">
          <div style="display:flex;gap:8px">
            <input id="uQuery" data-i18n-ph="phSearchEmail" placeholder="搜索邮箱">
            <button class="btn ghost" id="uSearch" style="flex:none" data-i18n="btnSearch">搜索</button>
          </div>
        </div>
        <div class="card" style="padding:0;overflow:auto;max-height:70vh">
          <table><thead><tr>
            <th data-i18n="thEmail">邮箱</th><th data-i18n="thPlan">版本</th><th data-i18n="thExpiry">到期</th>
            <th data-i18n="thVerified">验证</th><th data-i18n="thActions">操作</th>
          </tr></thead><tbody id="userBody"></tbody></table>
        </div>
      </section>

      <section class="tab" id="tab-msgs">
        <div class="card" style="padding:0;overflow:auto;max-height:70vh">
          <table><thead><tr>
            <th data-i18n="thTime">时间</th><th data-i18n="thName">姓名</th><th data-i18n="thContact">联系</th><th data-i18n="thMessage">留言</th>
          </tr></thead><tbody id="msgBody"></tbody></table>
        </div>
      </section>

      <section class="tab" id="tab-admins">
        <div class="card">
          <h3 style="margin:0 0 10px;font-size:15px;color:var(--navy)" data-i18n="newAdmin">新增管理员</h3>
          <div class="grid3">
            <div><label data-i18n="thEmail">邮箱</label><input id="naEmail" type="email" placeholder="staff@example.com"></div>
            <div><label data-i18n="lblInitPw">初始密码（≥8 位）</label><input id="naPw" type="password"></div>
            <div><label data-i18n="lblRole">权限</label><select id="naRole">
              <option value="admin" data-i18n="optRoleAdmin">管理员（可发码/改用户）</option>
              <option value="viewer" data-i18n="optRoleViewer">只读（仅查看）</option>
            </select></div>
          </div>
          <button class="btn gold" id="naBtn" style="margin-top:12px" data-i18n="btnAdd">添加</button>
          <div class="msg" id="naMsg"></div>
        </div>
        <div class="card" style="padding:0;overflow:auto">
          <table><thead><tr>
            <th data-i18n="thEmail">邮箱</th><th data-i18n="lblRole">权限</th><th data-i18n="thStatus">状态</th>
            <th data-i18n="thLastLogin">最近登录</th><th data-i18n="thActions">操作</th>
          </tr></thead><tbody id="admBody"></tbody></table>
        </div>
      </section>

      <section class="tab" id="tab-refunds">
        <div class="card" style="padding:0;overflow:auto;max-height:70vh">
          <table><thead><tr>
            <th data-i18n="thTime">时间</th><th data-i18n="thEmail">邮箱</th><th data-i18n="thReceipt">收据</th>
            <th data-i18n="thAmount">金额</th><th data-i18n="thReason">原因</th><th data-i18n="thStatus">状态</th>
            <th data-i18n="thActions">操作</th>
          </tr></thead><tbody id="refundBody"></tbody></table>
        </div>
      </section>

      <section class="tab" id="tab-logs">
        <div class="card" style="padding:0;overflow:auto;max-height:70vh">
          <table><thead><tr>
            <th data-i18n="thTime">时间</th><th data-i18n="thAction">动作</th><th data-i18n="thDetail">详情</th>
          </tr></thead><tbody id="logBody"></tbody></table>
        </div>
      </section>

      <section class="tab" id="tab-views">
        <div class="card" style="padding:14px;margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <b data-i18n="evTitle">事件（近 7 天转化漏斗）</b>
            <span class="muted" id="evTotal"></span>
          </div>
          <table><thead><tr><th data-i18n="evName">事件</th><th data-i18n="evCount">次数</th><th data-i18n="evPeople">独立访客</th></tr></thead><tbody id="evBody"></tbody></table>
        </div>
        <div class="grid">
          <div class="card" style="padding:0;overflow:auto"><table><thead><tr>
            <th data-i18n="thDate">日期</th><th data-i18n="thViews">浏览</th>
          </tr></thead><tbody id="dayBody"></tbody></table></div>
          <div class="card" style="padding:0;overflow:auto"><table><thead><tr>
            <th data-i18n="thPage">页面</th><th data-i18n="thViews">浏览</th>
          </tr></thead><tbody id="topBody"></tbody></table></div>
        </div>
      </section>
    </div>
  </div>
</main>
<div id="pwdModal" hidden style="position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60">
  <div style="background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%">
    <h3 style="margin:0 0 12px;color:var(--navy);font-size:16px" data-i18n="pwdTitle">修改登录密码</h3>
    <label data-i18n="lblCurrentPw">当前密码</label>
    <input id="cpCur" type="password" autocomplete="current-password">
    <label style="margin-top:10px" data-i18n="lblNewPw8">新密码（至少 8 位）</label>
    <input id="cpNew" type="password" autocomplete="new-password">
    <label style="margin-top:10px" data-i18n="lblConfirmPw">确认新密码</label>
    <input id="cpNew2" type="password" autocomplete="new-password">
    <div class="msg" id="cpMsg"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn gold" id="cpSave" data-i18n="btnSave">保存</button>
      <button class="btn ghost" id="cpCancel" data-i18n="btnCancel">取消</button>
    </div>
  </div>
</div>

  var KEY = "kwongthye_lang";
  var lang = "zh";
  try { lang = localStorage.getItem(KEY) || "zh"; } catch (e) {}

  function t(k, vars) {
    var s = (I18N[lang] && I18N[lang][k]) || I18N.zh[k] || k;
    if (vars) Object.keys(vars).forEach(function (n) { s = s.split("{" + n + "}").join(vars[n]); });
    return s;
  }

  function api(path, opts) {
    opts = opts || {};
    return fetch("/api/admin" + path, {
      method: opts.method || "GET",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.json().then(function (j) { j._status = r.status; return j; }).catch(function () { return { ok: false, _status: r.status }; });
    });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var myRole = "owner";
  var isApp = false;

  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = (lang === "zh" ? "管理后台" : "Admin") + " — KWONG THYE";
    $("langBtn").textContent = lang === "zh" ? "EN" : "中文";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (I18N[lang][k]) el.textContent = I18N[lang][k];
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
      var k = el.getAttribute("data-i18n-ph");
      if (I18N[lang][k]) el.placeholder = I18N[lang][k];
    });
    if (isApp) {
      renderRoleTag();
      renderWhoLine();
      loadStats(); loadCharts(); loadList(); loadUsers($("uQuery").value.trim()); loadRefunds(); loadEvents();
      loadMsgs(); loadViews(); loadLogs();
      if (myRole === "owner") loadAdmins();
    }
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }

  function renderWhoLine() {
    var d = new Date();
    $("whoLine").textContent = t("loggedAt", {
      d: d.toLocaleDateString(lang === "zh" ? "zh-CN" : "en-MY") + " " +
         d.toLocaleTimeString(lang === "zh" ? "zh-CN" : "en-MY", { hour: "2-digit", minute: "2-digit" })
    });
  }

  function show(v) {
    isApp = v;
    $("app").hidden = !v; $("loginBox").hidden = v;
    $("logoutBtn").hidden = !v; $("who").hidden = !v; $("pwdBtn").hidden = !v;
    if (v) { renderWhoLine(); window.scrollTo(0, 0); }
  }

  function loadStats() {
    api("/overview").then(function (j) {
      if (!j.ok) return;
      var items = [[t("statUsers"), j.users], [t("statPro"), j.pro], [t("statPlans"), j.plans],
        [t("statMessages"), j.messages], [t("statPayments"), j.payments], [t("statViews"), j.views7]];
      $("stats").innerHTML = items.map(function (x) { return '<div class="stat"><b>' + x[1] + "</b><span>" + x[0] + "</span></div>"; }).join("");
    });
  }

  function renderBars(el, data, opts) {
    if (!el) return;
    opts = opts || {};
    const max = Math.max(1, ...data.map(d => d.n));
    el.innerHTML = data.map(function (d) {
      const w = Math.round((d.n / max) * 100);
      const label = d.day.slice(5).replace("-", "/");
      const val = opts.money ? ("RM" + (d.n >= 1000 ? (d.n / 1000).toFixed(1) + "k" : d.n.toFixed(0))) : String(d.n);
      return '<div class="barRow"><span class="d">' + label + '</span>' +
        '<span class="track"><span class="fill' + (opts.gold ? " gold" : "") + '" style="width:' + w + '%"></span></span>' +
        '<span class="v">' + val + "</span></div>";
    }).join("");
  }
  function loadCharts() {
    api("/charts?days=14").then(function (j) {
      if (!j.ok) return;
      renderBars($("chRev"), j.revenue || [], { money: true, gold: true });
      renderBars($("chUsers"), j.signups || []);
      renderBars($("chViews"), j.views || []);
      const sum = function (arr) { return (arr || []).reduce(function (a, b) { return a + Number(b.n || 0); }, 0); };
      $("chRevSum").textContent = "RM " + sum(j.revenue).toFixed(2) + " · " + t("chTotal") + " RM " + Number(j.totals.totalRevenue || 0).toFixed(2);
      $("chUserSum").textContent = "+" + sum(j.signups) + " · " + t("chConv") + " " + (j.totals.conversion || 0) + "%";
      $("chViewSum").textContent = sum(j.views) + " PV";
    });
  }

    api("/codes").then(function (j) {
      if (!j.ok) return;
      $("listBody").innerHTML = (j.codes || []).map(function (c) {

          "</td><td>" + (c.used_count || 0) + "/" + c.max_uses + "</td><td>" + (c.label === "promo" ? t("typePromo") : t("typeNormal")) +

      }).join("") || "<tr><td colspan=7 class='muted'>" + t("empty") + "</td></tr>";
    });
  }

          "<button class='btn ghost' style='padding:4px 8px;font-size:11px' data-act='ext' data-id='" + u.id + "' data-email='" + esc(u.email) + "'>" + t("actExtend") + "</button> " +

  function loadRefunds() {
    api("/refunds").then(function (j) {
      if (!j.ok) return;
      const badge = function (st) {
        if (st === "pending") return '<span class="tag" style="background:#FFF3CD;color:#7A5B12">' + t("rfPending") + "</span>";
        if (st === "approved") return '<span class="tag pro">' + t("rfApproved") + "</span>";
        return '<span class="tag" style="background:#FDECEC;color:#B23B3B">' + t("rfRejected") + "</span>";
      };
      $("refundBody").innerHTML = (j.refunds || []).map(function (r) {
        const acts = r.status === "pending"
          ? '<button class="btn gold" style="padding:4px 10px;font-size:11px" data-rf="ok" data-id="' + r.id + '">' + t("rfApprove") + "</button> " +
            '<button class="btn ghost" style="padding:4px 10px;font-size:11px" data-rf="no" data-id="' + r.id + '">' + t("rfDecline") + "</button>"
          : '<span class="muted">' + (r.admin_note ? esc(r.admin_note) : "—") + "</span>";
        return "<tr><td class='muted'>" + String(r.created_at).slice(0, 16).replace("T", " ") + "</td><td>" + esc(r.email) +
          "</td><td class='mono'>" + esc(r.receipt_no || "—") + "</td><td>RM" + Number(r.amount || 0).toFixed(2) +
          "</td><td>" + esc(r.reason) + "</td><td>" + badge(r.status) + "</td><td>" + acts + "</td></tr>";

    var id = b.getAttribute("data-id"), act = b.getAttribute("data-a");
    if (act === "pwd") {
      var pw = prompt(t("promptNewPw")); if (!pw) return;
      api("/admins/" + id, { method: "PATCH", body: { password: pw } }).then(function (j) { alert(j.ok ? t("doneReset") : t("failed", { e: j.error || j._status })); loadAdmins(); });
    } else if (act === "toggle") {
      var active = b.getAttribute("data-active") === "true";
      api("/admins/" + id, { method: "PATCH", body: { active: !active } }).then(function (j) { if (!j.ok) alert(t("failed", { e: j.error || j._status })); loadAdmins(); });
    } else if (act === "del") {
      if (!confirm(t("confirmDeleteAdmin", { email: b.getAttribute("data-email") }))) return;
      api("/admins/" + id, { method: "DELETE" }).then(function (j) { alert(j.ok ? t("doneDeleted") : t("failed", { e: j.error || j._status })); loadAdmins(); });
    }
  });

  function boot(me) {
    show(true);
    applyRole(me && me.role);
    loadStats(); loadCharts(); loadList(); loadUsers(""); loadMsgs(); loadViews(); loadEvents(); loadLogs();
    if (myRole === "owner") loadAdmins();
    $("logoutBtn").onclick = function () {
      api("/logout", { method: "POST" }).then(function () { show(false); });
    };
  }

  var loginEmail = "";
  $("pwdBtn").onclick = function () {
    $("cpCur").value = ""; $("cpNew").value = ""; $("cpNew2").value = "";
    $("cpMsg").textContent = ""; $("cpMsg").className = "msg";
    $("pwdModal").hidden = false; $("cpCur").focus();
  };
  $("cpCancel").onclick = function () { $("pwdModal").hidden = true; };
  $("cpSave").onclick = function () {
    var cur = $("cpCur").value, nw = $("cpNew").value, nw2 = $("cpNew2").value;
    var msg = $("cpMsg");
    if (nw.length < 8) { msg.className = "msg err"; msg.textContent = t("pwTooShort"); return; }
    if (nw !== nw2) { msg.className = "msg err"; msg.textContent = t("pwMismatch"); return; }
    api("/change-password", { method: "POST", body: { current: cur, password: nw } }).then(function (j) {
      if (j.ok) {
        $("pwdModal").hidden = true;
        alert(t("pwChanged"));
      } else {
        msg.className = "msg err";
        msg.textContent = j.error === "bad_current" ? t("badCurrent")
          : j.error === "owner_env" ? t("ownerEnv")
          : t("pwFail", { e: j.error || j._status });
      }
    });
  };

  $("loginBtn").onclick = function () {
    var pw = $("pw").value;
    if (!pw) return;
    $("loginMsg").textContent = ""; $("loginMsg").className = "msg";
    api("/login", { method: "POST", body: { email: $("admEmail").value.trim(), password: pw } }).then(function (j) {
      if (j.ok && j.needOtp) {
        loginEmail = j.email || "";
        $("otpWrap").hidden = false; $("otp").focus();
        $("loginMsg").className = "msg ok";
        $("loginMsg").textContent = t("otpSent", { email: loginEmail });
      } else if (j.ok) { boot(j); }
      else {
        $("loginMsg").className = "msg err";
        $("loginMsg").textContent = j.error === "bad_password" ? t("badPassword")
          : j.error === "mail_failed" ? t("mailFailed")
          : t("loginFail", { e: j.error || j._status });
      }
    });
  };
  $("verifyBtn").onclick = function () {
    var code = $("otp").value.trim();
    if (!code) return;
    api("/verify", { method: "POST", body: { code: code, email: loginEmail } }).then(function (j) {
      if (j.ok) { $("otp").value = ""; $("otpWrap").hidden = true; boot(j); }
      else { $("loginMsg").className = "msg err"; $("loginMsg").textContent = t("otpBad"); }
    });
  };
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginBtn").click(); });
  $("otp").addEventListener("keydown", function (e) { if (e.key === "Enter") $("verifyBtn").click(); });

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.remove("on"); });
      document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on"); $("tab-" + b.getAttribute("data-tab")).classList.add("on");
      if (b.getAttribute("data-tab") === "list") loadList();
      if (b.getAttribute("data-tab") === "msgs") loadMsgs();
      if (b.getAttribute("data-tab") === "views") loadViews();
      if (b.getAttribute("data-tab") === "logs") loadLogs();
      if (b.getAttribute("data-tab") === "admins") loadAdmins();
      if (b.getAttribute("data-tab") === "refunds") loadRefunds();
    };
  });

  $("genBtn").onclick = function () {
    var body = { days: $("cDays").value, count: $("cCount").value, note: $("cNote").value };
    if ($("cAmount").value) body.amount = $("cAmount").value;
    api("/codes", { method: "POST", body: body }).then(function (j) {
      if (!j.ok) { $("genMsg").className = "msg err"; $("genMsg").textContent = t("genFail", { e: j.error || j._status }); return; }
      $("genMsg").className = "msg ok";
      $("genMsg").textContent = t("genOk", { n: j.codes.length, days: j.days, amount: Number(j.amount).toFixed(2) });
      $("genOut").innerHTML = j.codes.map(function (c) {
        return '<span class="code"><b>' + esc(c) + '</b><button data-c="' + esc(c) + '">' + t("copy") + "</button></span>";
      }).join("");
      $("genOut").querySelectorAll("button").forEach(function (b) {
        b.onclick = function () { navigator.clipboard.writeText(b.getAttribute("data-c")); b.textContent = t("copied"); };
      });
      loadList(); loadStats();
    });
  };

  $("promoBtn").onclick = function () {
    var body = { code: $("pCode").value, days: $("pDays").value, maxUses: $("pMax").value, amount: $("pAmount").value, note: $("pNote").value, expiryDays: $("pExp").value };
    api("/promo", { method: "POST", body: body }).then(function (j) {
      if (!j.ok) { $("promoMsg").className = "msg err"; $("promoMsg").textContent = t("promoFail", { e: j.error || j._status }); return; }
      $("promoMsg").className = "msg ok";
      $("promoMsg").textContent = t("promoOk", { code: j.code, days: j.days, amount: j.amount, max: j.maxUses });
      loadList();
    });
  };

  $("uSearch").onclick = function () { loadUsers($("uQuery").value.trim()); };

  $("langBtn").onclick = function () {
    lang = lang === "zh" ? "en" : "zh";
    applyLang();
  };

  applyLang();
  api("/me").then(function (j) { if (j.ok) boot(j); else show(false); }).catch(function () { show(false); });
})();
</script>
</body>
</html>
