<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找房 | PropNet 新山房源</title>
<meta name="description" content="按区域、预算、房型搜索柔佛新山在售与在租房源；每套房源标明货源中介。Find property listings in Johor Bahru by area, budget and type.">
<link rel="canonical" href="https://kwongthye.com/properties/">
<meta property="og:title" content="找房 | PropNet 新山房源">
<meta property="og:description" content="按区域、预算、房型搜索新山房源。">
<meta property="og:url" content="https://kwongthye.com/properties/">
<link rel="icon" type="image/png" href="/icon-256.png">
<link rel="stylesheet" href="/site.css">
</head>
<body>

<header class="site-head">
  <div class="wrap bar">
    <a class="brand" href="/"><img src="/logo-white.png" alt="KWONG THYE 光泰"><span>PROPNET</span></a>
    <button class="menu-btn" aria-label="Menu">☰</button>
    <nav class="site-nav">
      <a href="/properties/" class="on" data-i18n="nav.find">找房</a>
      <a href="/agents/" data-i18n="nav.agents">找中介</a>
      <a href="/join/" data-i18n="nav.join">给中介</a>
      <a href="/about/" data-i18n="nav.about">关于</a>
      <a href="https://calc.kwongthye.com/" data-i18n="nav.calc">计算器</a>
      <a class="login" href="/library/" data-i18n="nav.login">中介登录</a>
      <button class="lang-toggle">EN</button>
    </nav>
  </div>
</header>

<main>
  <section class="sec" style="padding-bottom:34px">
    <div class="wrap">
      <div class="eyebrow" data-i18n="list.kicker">房源</div>
      <h1 style="font-size:clamp(28px,3.4vw,40px)" id="pageHead" data-i18n="list.title">找房</h1>
      <p class="lead" id="pageSub" data-i18n="list.sub">按区域、预算、房型筛选。点开房源看货源中介。</p>

      <form class="filterbar" id="filterForm">
        <div class="f">
          <label data-i18n="search.intent">买 / 租</label>
          <div class="seg" id="intentSeg">
            <button type="button" data-intent="sale" data-i18n="search.sale">买</button>
            <button type="button" data-intent="rent" data-i18n="search.rent">租</button>
          </div>
        </div>
        <div class="f">
          <label for="fQ" data-i18n="list.keyword">关键词</label>
          <input id="fQ" type="search" placeholder="Sutera / 公寓 / 12-03">
        </div>
        <div class="f">
          <label for="fArea" data-i18n="search.area">区域</label>
          <select id="fArea"></select>
        </div>
        <div class="f">
          <label for="fType" data-i18n="search.type">房型</label>
          <select id="fType"></select>
        </div>
        <div class="f">
          <label for="fMin" data-i18n="list.min">最低价</label>
          <input id="fMin" type="number" min="0" step="1000" placeholder="不限">
        </div>
        <div class="f">
          <label for="fMax" data-i18n="list.max">最高价</label>
          <input id="fMax" type="number" min="0" step="1000" placeholder="不限">
        </div>
        <button class="btn gold" type="submit" data-i18n="list.filter">筛选</button>
      </form>
    </div>
  </section>

  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <div class="spread" style="margin-bottom:18px">
        <div class="muted" id="countLine"></div>
        <a class="btn line sm" href="/join/" data-i18n="list.join">我是中介，想发布房源 →</a>
      </div>
      <div class="grid-3" id="grid"></div>
      <div id="emptyBox" hidden></div>
      <div class="row" style="justify-content:center;margin-top:28px" id="pager"></div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="cols">
      <div><b>KWONG THYE · PROPNET</b><p data-i18n="foot.tag">新山房源与中介网络。房源被看见，合作有记录。</p></div>
      <div><b data-i18n="foot.platform">平台</b><p><a href="/properties/" data-i18n="nav.find">找房</a><br><a href="/agents/" data-i18n="nav.agents">找中介</a><br><a href="/join/" data-i18n="nav.join">给中介</a></p></div>
      <div><b data-i18n="foot.company">公司</b><p><a href="/about/" data-i18n="nav.about">关于</a><br><a href="/pricing/" data-i18n="foot.pricing">价格</a><br><a href="/privacy/" data-i18n="foot.privacy">隐私政策</a><br><a href="/terms/" data-i18n="foot.terms">使用条款</a></p></div>
    </div>
    <div class="legal"><span>© 2026 KWONG THYE.</span><span>THE ROOF REALTY SDN BHD · E(1)1605/1</span><span>Andy Lau REN 32839</span></div>
  </div>
</footer>

<div id="detailRoot"></div>

<script>
window.PAGE_I18N = {
  "nav.find": ["找房", "Find a home"], "nav.agents": ["找中介", "Agents"], "nav.join": ["给中介", "For agents"],
  "nav.about": ["关于", "About"], "nav.calc": ["计算器", "Calculator"], "nav.login": ["中介登录", "Agent login"],
  "list.kicker": ["房源", "Listings"],
  "list.title": ["找房", "Find a home"],
  "list.sub": ["按区域、预算、房型筛选。点开房源看货源中介。", "Filter by area, budget and type. Open a listing to see the agent behind it."],
  "list.keyword": ["关键词", "Keyword"],
  "list.min": ["最低价", "Min price"],
  "list.max": ["最高价", "Max price"],
  "list.filter": ["筛选", "Filter"],
  "list.join": ["我是中介，想发布房源 →", "I'm an agent — list with us →"],
  "search.intent": ["买 / 租", "Buy / Rent"], "search.sale": ["买", "Buy"], "search.rent": ["租", "Rent"],
  "search.area": ["区域", "Area"], "search.type": ["房型", "Type"],
  "list.anyArea": ["全部区域", "All areas"], "list.anyType": ["全部房型", "All types"],
  "list.none": ["没有符合条件的房源", "No listings match"],
  "list.noneSub": ["换个条件试试，或先预约成为首批中介。", "Try different filters, or join as a founding agent."],
  "list.count": ["共 {n} 套房源", "{n} listings"],
  "list.count1": ["共 1 套房源", "1 listing"],
  "list.prev": ["上一页", "Previous"], "list.next": ["下一页", "Next"],
  "detail.back": ["← 返回房源列表", "← Back to listings"],
  "detail.overview": ["房源信息", "Overview"],
  "detail.agent": ["货源中介", "Listed by"],
  "detail.call": ["拨打电话", "Call"],
  "detail.wa": ["WhatsApp 咨询", "WhatsApp"],
  "detail.unit": ["单位", "Unit"],
  "detail.size": ["面积", "Size"],
  "detail.layout": ["房间 / 卫浴", "Beds / baths"],
  "detail.type": ["房型", "Type"],
  "detail.tenure": ["产权", "Tenure"],
  "detail.furnish": ["装修", "Furnishing"],
  "detail.condition": ["状况", "Condition"],
  "detail.listed": ["上架", "Listed"],
  "detail.ref": ["编号", "Ref"],
  "detail.carparks": ["车位", "Car parks"],
  "detail.rentNote": ["每月租金", "Monthly rent"],
  "detail.priceNote": ["售价", "Asking price"],
  "detail.notFound": ["找不到这套房源", "Listing not found"],
  "detail.disclaimer": ["资料由货源中介提供，以现场与正式文件为准。", "Information provided by the listing agent; subject to viewing and formal documents."],
  "foot.tag": ["新山房源与中介网络。房源被看见，合作有记录。", "Johor Bahru listings and agent network."],
  "foot.platform": ["平台", "Platform"], "foot.company": ["公司", "Company"],
  "foot.pricing": ["价格", "Pricing"], "foot.privacy": ["隐私政策", "Privacy"], "foot.terms": ["使用条款", "Terms"]
};
</script>
<script src="/site.js"></script>
<script>
(function () {
  "use strict";
  KT.init(window.PAGE_I18N);
  var state = { cfg: null, q: {}, page: 1, pageSize: 12, total: 0, rows: [] };

  function parseQuery() {
    var u = new URLSearchParams(location.search);
    var q = {};
    ["q", "area", "type", "intent", "min", "max", "beds", "agent", "page"].forEach(function (k) {
      if (u.get(k)) q[k] = u.get(k);
    });
    if (!q.intent) q.intent = "sale";
    return q;
  }

  function pushQuery(q) {
    var u = new URLSearchParams();
    Object.keys(q).forEach(function (k) { if (q[k]) u.set(k, q[k]); });
    history.replaceState(null, "", "/properties/" + (u.toString() ? "?" + u.toString() : ""));
  }

  function fillSelects() {
    var a = document.getElementById("fArea");
    var t = document.getElementById("fType");
    var areas = (state.cfg && state.cfg.areas) || [];
    a.innerHTML = '<option value="">' + KT.t("list.anyArea") + "</option>" + areas.map(function (x) {
      var name = x.key === "other" ? (KT.lang === "en" ? "Other area" : "其他区域") : (KT.lang === "en" ? x.en : x.zh);
      return '<option value="' + x.key + '">' + KT.esc(name) + "</option>";
    }).join("");
    var types = (state.cfg && state.cfg.taxonomy && state.cfg.taxonomy.property_types) || [];
    t.innerHTML = '<option value="">' + KT.t("list.anyType") + "</option>" + types.map(function (x) {
      return '<option value="' + x.key + '">' + KT.esc(KT.lang === "en" ? x.en : x.zh) + "</option>";
    }).join("");
  }

  function syncForm() {
    document.getElementById("fQ").value = state.q.q || "";
    document.getElementById("fArea").value = state.q.area || "";
    document.getElementById("fType").value = state.q.type || "";
    document.getElementById("fMin").value = state.q.min || "";
    document.getElementById("fMax").value = state.q.max || "";
    Array.prototype.forEach.call(document.querySelectorAll("#intentSeg button"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-intent") === (state.q.intent || "sale"));
    });
  }

  function renderList() {
    var grid = document.getElementById("grid");
    var empty = document.getElementById("emptyBox");
    var count = document.getElementById("countLine");
    count.textContent = KT.t(state.total === 1 ? "list.count1" : "list.count").replace("{n}", state.total);
    if (!state.rows.length) {
      grid.innerHTML = "";
      empty.hidden = false;
      empty.innerHTML = '<div class="empty"><b>' + KT.t("list.none") + "</b><p>" + KT.t("list.noneSub") + "</p>" +
        '<div class="row" style="justify-content:center"><a class="btn dark" href="/join/">' +
        (KT.lang === "en" ? "Join PropNet" : "加入 PropNet") + '</a><a class="btn line" href="/properties/">' +
        (KT.lang === "en" ? "Clear filters" : "清除筛选") + "</a></div></div>";
      document.getElementById("pager").innerHTML = "";
      return;
    }
    empty.hidden = true;
    grid.innerHTML = state.rows.map(KT.listingCard).join("");
    var pages = Math.ceil(state.total / state.pageSize);
    var pager = document.getElementById("pager");
    if (pages <= 1) { pager.innerHTML = ""; return; }
    pager.innerHTML =
      '<button class="btn line sm" data-page="' + (state.page - 1) + '"' + (state.page <= 1 ? " disabled" : "") + ">" + KT.t("list.prev") + "</button>" +
      '<span class="muted" style="padding:0 12px">' + state.page + " / " + pages + "</span>" +
      '<button class="btn line sm" data-page="' + (state.page + 1) + '"' + (state.page >= pages ? " disabled" : "") + ">" + KT.t("list.next") + "</button>";
  }

  function load() {
    state.q = parseQuery();
    state.page = Number(state.q.page) || 1;
    syncForm();
    var u = new URLSearchParams();
    ["q", "area", "type", "intent", "min", "max", "beds", "agent"].forEach(function (k) {
      if (state.q[k]) u.set(k, state.q[k]);
    });
    u.set("page", state.page);
    u.set("pageSize", state.pageSize);
    document.getElementById("grid").innerHTML = KT.skeletonCards(6);
    KT.fetchJSON("/api/public/properties?" + u.toString()).then(function (j) {
      state.rows = j.rows || [];
      state.total = j.total || 0;
      renderList();
    }).catch(function () { state.rows = []; state.total = 0; renderList(); });
  }

  // 详情
  function renderDetail(code) {
    var root = document.getElementById("detailRoot");
    KT.fetchJSON("/api/public/properties/" + encodeURIComponent(code)).then(function (j) {
      var p = j.row, a = j.agent;
      var isRent = p.intent === "rent";
      var price = isRent ? p.rent_price : p.asking_price;
      var title = KT.lang === "en" ? (p.project_title || p.project_name) : (p.project_title_zh || p.project_title || p.project_name);
      document.title = title + " · " + p.code + " | PropNet";
      var wa = a && a.phone ? "https://wa.me/" + String(a.phone).replace(/\D/g, "").replace(/^0/, "60") : null;
      root.innerHTML = '<div class="ovl" style="position:fixed;inset:0;background:rgba(14,36,56,.55);z-index:100" id="dOvl"></div>' +
        '<div style="position:fixed;inset:0;z-index:101;overflow:auto;padding:4vh 4vw" id="dBox">' +
        '<div style="max-width:820px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden">' +
        '<div style="background:linear-gradient(135deg,#16395A,#0E2438);color:#fff;padding:22px 24px;position:relative">' +
        '<button id="dClose" style="position:absolute;right:14px;top:14px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer">×</button>' +
        '<div class="eyebrow" style="color:var(--gold2);margin-bottom:6px">' + KT.esc(KT.area(p.area_code)) + " · " + KT.esc(p.code) + "</div>" +
        '<h2 style="color:#fff;font-size:26px;margin:0">' + KT.esc(title) + "</h2>" +
        '<div style="color:rgba(255,255,255,.72);margin-top:4px">' + KT.esc([p.block, p.unit_no].filter(Boolean).join(" · ")) + "</div>" +
        '<div style="font-family:var(--serif);font-size:30px;color:var(--gold2);margin-top:14px">' + KT.money(price) +
        (isRent ? '<span style="font-size:14px;color:rgba(255,255,255,.6)"> / ' + (KT.lang === "en" ? "mo" : "月") + "</span>" : "") + "</div>" +
        "</div>" +
        '<div style="padding:22px 24px">' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px" class="detailGrid">' +
        kv("detail.layout", [p.bedrooms, p.bathrooms].filter(function (x) { return x != null; }).join(" / ")) +
        kv("detail.size", p.built_up ? KT.int(p.built_up) + " sqft" : "—") +
        kv("detail.type", KT.label("property_types", p.property_type)) +
        kv("detail.tenure", KT.label("tenures", p.tenure)) +
        kv("detail.furnish", KT.label("furnishings", p.furnishing)) +
        kv("detail.condition", KT.label("conditions", p.condition)) +
        kv("detail.listed", KT.date(p.listed_on)) +
        kv("detail.ref", p.code) +
        kv("detail.carparks", p.carparks != null ? p.carparks : "—") +
        "</div>" +
        '<div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--line)">' +
        '<div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">' + KT.t("detail.agent") + "</div>" +
        '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#1B4166,#0E2438);color:var(--gold2);display:grid;place-items:center;font-family:var(--serif)">' +
        KT.esc(((a && a.name) || p.agent_raw || "KT").slice(0, 2).toUpperCase()) + "</div>" +
        "<div><b>" + KT.esc((a && a.name) || p.agent_raw || "KWONG THYE") + "</b>" + (a && a.ren_no ? '<div class="muted" style="font-size:12px">' + KT.esc(a.ren_no) + "</div>" : "") + "</div>" +
        (a && a.phone ? '<div class="row" style="margin-left:auto"><a class="btn dark sm" href="tel:' + KT.esc(a.phone) + '">' + KT.t("detail.call") + "</a>" +
          (wa ? '<a class="btn gold sm" href="' + wa + '" target="_blank" rel="noopener">' + KT.t("detail.wa") + "</a>" : "") + "</div>" : "") +
        "</div></div>" +
        '<p class="muted" style="font-size:11.5px;margin-top:18px">' + KT.t("detail.disclaimer") + "</p>" +
        "</div></div></div>";
      document.body.style.overflow = "hidden";
      document.getElementById("dClose").onclick = closeDetail;
      document.getElementById("dOvl").onclick = closeDetail;
      document.addEventListener("keydown", escClose);
    }).catch(function () {
      root.innerHTML = "";
      alert(KT.t("detail.notFound"));
    });
  }
  function kv(key, value) {
    return '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">' + KT.t(key) + "</div><div>" + KT.esc(value || "—") + "</div></div>";
  }
  function closeDetail() {
    document.getElementById("detailRoot").innerHTML = "";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", escClose);
    var u = new URLSearchParams(location.search);
    u.delete("p");
    history.replaceState(null, "", "/properties/" + (u.toString() ? "?" + u.toString() : ""));
  }
  function escClose(e) { if (e.key === "Escape") closeDetail(); }

  // 事件
  document.getElementById("filterForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var onBtn = document.querySelector("#intentSeg button.on");
    state.q = {
      intent: onBtn ? onBtn.getAttribute("data-intent") : "sale",
      q: document.getElementById("fQ").value.trim(),
      area: document.getElementById("fArea").value,
      type: document.getElementById("fType").value,
      min: document.getElementById("fMin").value,
      max: document.getElementById("fMax").value
    };
    pushQuery(state.q);
    load();
  });
  document.getElementById("intentSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-intent]");
    if (!b) return;
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) { x.classList.toggle("on", x === b); });
  });
  document.getElementById("pager").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-page]");
    if (!b || b.disabled) return;
    state.q.page = b.getAttribute("data-page");
    pushQuery(state.q);
    load();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("grid").addEventListener("click", function (e) {
    var a = e.target.closest("a.pcard");
    if (!a) return;
    e.preventDefault();
    var code = new URL(a.href).searchParams.get("p");
    if (!code) return;
    var u = new URLSearchParams(location.search);
    u.set("p", code);
    history.replaceState(null, "", "/properties/?" + u.toString());
    renderDetail(code);
  });
  document.addEventListener("kt:lang", function () {
    if (!document.getElementById("detailRoot").innerHTML) renderList();
  });

  KT.fetchJSON("/api/public/config").then(function (cfg) {
    state.cfg = cfg;
    KT.setTax(Object.assign({ areas: cfg.areas }, cfg.taxonomy || {}));
    fillSelects();
    syncForm();
    load();
  }).catch(function () { fillSelects(); load(); });

  var initialP = new URLSearchParams(location.search).get("p");
  if (initialP) renderDetail(initialP);
})();
</script>
</body>
</html>
