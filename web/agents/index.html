  "ag.kicker": ["认证中介", "Verified agents"],
  "ag.title": ["找一位懂这个区的人", "Find someone who knows the area"],
  "ag.sub": ["每位中介都有 REN 编号与专长区域；点进去看他的在售房源。", "Every agent has a REN and an area of focus. Open a profile to see their listings."],
  "ag.listings": ["套房源", "listings"],
  "ag.view": ["看房源 →", "View listings →"],
  "ag.empty": ["首批认证中介正在上线", "The first verified agents are onboarding"],
  "ag.emptySub": ["PropNet 正在招募首批 80 位中介。现在加入，你会是目录里的第一批。", "We are onboarding the first 80 agents. Join now and be among the first in the directory."],
  "ag.join": ["申请加入", "Apply to join"],
  "ag.bandK": ["你是中介吗？", "Are you an agent?"],
  "ag.bandT": ["把你的名片放进目录", "Put your card in the directory"],

  "ag.bandC": ["加入 PropNet", "Join PropNet"],

  "foot.platform": ["平台", "Platform"], "foot.company": ["公司", "Company"], "foot.pricing": ["价格", "Pricing"],

};
</script>
<script src="/site.js"></script>
<script>
(function () {
  "use strict";
  KT.init(window.PAGE_I18N);
  var state = { rows: [], tax: null };

  function render() {
    var grid = document.getElementById("grid");
    var empty = document.getElementById("emptyBox");
    if (!state.rows.length) {
      grid.innerHTML = "";
      empty.hidden = false;
      empty.innerHTML = '<div class="empty"><b>' + KT.t("ag.empty") + "</b><p>" + KT.t("ag.emptySub") + "</p>" +
        '<a class="btn dark" href="/join/">' + KT.t("ag.join") + "</a></div>";
      return;
    }
    empty.hidden = true;
    grid.innerHTML = state.rows.map(function (a) {
      var initials = (a.name || "A").replace(/[^A-Za-z\u4e00-\u9fa5]/g, "").slice(0, 2).toUpperCase();
      return '<div class="agent-card"><div class="avatar">' + KT.esc(initials) + "</div>" +
        "<b>" + KT.esc(a.name) + "</b><small>" + KT.esc(a.ren_no || "KWONG THYE") + "</small>" +
        '<div style="margin-top:6px"><span class="tag">' + a.listings + " " + KT.t("ag.listings") + "</span></div>" +
        (a.slug ? '<a class="btn line sm" style="margin-top:12px" href="/a/' + encodeURIComponent(a.slug) + '">' + KT.t("ag.page") + "</a>" : "") +
        '<a class="btn gold sm" style="margin-top:8px" href="/properties/?agent=' + encodeURIComponent(a.name) + '">' + KT.t("ag.view") + "</a></div>";
    }).join("");
  }

  KT.fetchJSON("/api/public/agents").then(function (j) {
    state.rows = j.rows || [];
    render();
  }).catch(function () { location.replace("/agent/"); });
  document.addEventListener("kt:lang", render);
})();
</script>
