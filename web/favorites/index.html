<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏 | RoofX</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/icon-256.png?v=tr1">
<link rel="stylesheet" href="/site.css?v=20261106m">
<style>
.favGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
@media(max-width:860px){.favGrid{grid-template-columns:1fr}}
.favCard{border:1px solid #E3E8F0;border-radius:14px;overflow:hidden;background:#fff;text-decoration:none;color:inherit}
.favCard img{width:100%;height:180px;object-fit:cover;display:block;background:#0E2438}
.favCard .b{padding:14px}
.favCard .t{font-weight:700;color:#0E2438;margin-bottom:4px}
.favCard .m{font-size:12.5px;color:#5D6B7A}
.favCard .p{font-family:Georgia,serif;color:#B8862F;font-size:19px;margin-top:8px}
.emptyFav{padding:44px;text-align:center;border:1px dashed #DCD6C8;border-radius:14px;color:#5D6B7A;margin-top:20px}
</style>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/neo.css?v=20261110fixed">
</head>
<body class="neo">
<header class="site-head"><div class="wrap bar">
  <a class="brand" href="/"><img src="/logo-white.png?v=tr1" alt="RoofX"><span>RoofX</span></a>
  <nav class="site-nav"><a href="/pool/">房源池</a><a href="/agents/">中介目录</a><a href="/join/">给中介</a><a class="login" href="/agent/">中介登录</a></nav>
</div></header>
<main class="wrap" style="padding:40px 0 80px">
  <div class="eyebrow">RoofX</div>
  <h1 id="favTitle" style="font-family:Georgia,serif;color:#0E2438;margin:6px 0 4px">我的收藏</h1>
  <p id="favSub" style="color:#5D6B7A;margin:0">保存在这台设备，不上传服务器。</p>
  <div id="favList" class="favGrid"></div>
  <div id="favEmpty" class="emptyFav" hidden><span id="favEmptyTxt">还没有收藏。在房源详情点「♡ 收藏」。</span></div>
</main>
<script src="/bm-public.js?v=20261106m"></script>
<script src="/lang3.js?v=20261110fixed"></script>
<script src="/site.js?v=20261110ai"></script>
<script>
(function () {
  var codes = [];
  try { codes = JSON.parse(localStorage.getItem("pn_favs") || "[]"); } catch (e) {}
  var list = document.getElementById("favList"), empty = document.getElementById("favEmpty");
  if (!codes.length) { empty.hidden = false; return; }
  fetch("/api/public/listings?codes=" + encodeURIComponent(codes.join(","))).then(function (r) { return r.json(); }).then(function (j) {
    var rows = j.rows || [];
    if (!rows.length) { empty.hidden = false; return; }
    list.innerHTML = rows.map(function (p) {
      var price = p.intent === "rent" ? p.rent_price : p.asking_price;
      return '<a class="favCard" href="/p/' + encodeURIComponent(p.code) + '">' +
        (p.cover_url ? '<img src="' + p.cover_url.replace(/\.jpg$/i, "_t.jpg") + '" loading="lazy" alt="">' : "") +
        '<div class="b"><div class="t">' + (p.project_title_zh || p.project_title || p.project_name || p.code) + '</div>' +
        '<div class="m">' + (p.area_code || "") + ' · ' + (p.bedrooms || "-") + "/" + (p.bathrooms || "-") + (p.built_up ? " · " + p.built_up + " sqft" : "") + '</div>' +
        '<div class="p">RM ' + Number(price || 0).toLocaleString("en-MY") + (p.intent === "rent" ? " /mo" : "") + '</div></div></a>';
    }).join("");
  }).catch(function () { empty.hidden = false; });
})();
</script>
<script>
(function(){var q=new URLSearchParams(location.search),l=q.get('lang')||localStorage.getItem('kt_lang')||'zh';var D={zh:['我的收藏','保存在这台设备，不上传服务器。','还没有收藏。在房源详情点「♡ 收藏」。'],en:['My saved listings','Saved on this device only.','No saved listings yet. Tap ♡ on a listing.'],bm:['Senarai simpanan','Disimpan pada peranti ini sahaja.','Belum ada simpanan. Tekan ♡ pada senarai.']}[l]||[];if(D.length){document.getElementById('favTitle').textContent=D[0];document.getElementById('favSub').textContent=D[1];document.getElementById('favEmptyTxt').textContent=D[2];}})();
</script>
</body>
</html>
