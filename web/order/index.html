<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Property agent websites: first month RM2,500, then RM1,500/month. Dedicated design, domain, hosting, listing sync and WhatsApp.">
<meta name="theme-color" content="#0F2740">
<title>房产中介建站 · RoofX Web Studio</title>
<link rel="icon" type="image/png" href="/icon-256.png?v=ord1">
<style>
  :root{
    --ink:#12212E;--navy:#0F2740;--navy2:#173A57;--paper:#F7F4EE;--card:#FFFFFF;
    --copper:#B5723F;--copper2:#9C5C2C;--line:#E3DCD0;--muted:#6B7785;
    --ok:#1F7A4D;--bad:#B03A2E;--radius:18px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--copper2)}
  .wrap{width:min(1120px,92vw);margin:0 auto}
  header{padding:18px 0;border-bottom:1px solid var(--line);background:rgba(247,244,238,.94);
    position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
  .bar{display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}
  .brand img{width:34px;height:34px;border-radius:9px}
  .brand b{font-family:Georgia,"Times New Roman",serif;font-size:18px;letter-spacing:.3px}
  .brand .sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;line-height:1.2}
  .langs{margin-left:auto;display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
  .langs button{border:0;background:transparent;color:var(--muted);font:600 12px/1 inherit;padding:7px 11px;border-radius:999px;cursor:pointer}
  .langs button.on{background:var(--navy);color:#fff}
  main{padding:46px 0 24px}
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:start}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--copper2);font-weight:700;margin-bottom:14px}
  .eyebrow:before{content:"";width:26px;height:2px;background:var(--copper)}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;color:var(--navy);
    font-size:clamp(30px,4.1vw,46px);line-height:1.16;margin:0 0 18px;letter-spacing:-.3px}
  h1 em{font-style:italic;color:var(--copper2)}
  .lead{color:#44515E;font-size:16.5px;max-width:56ch;margin:0 0 24px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;color:#3E4A57}
  .chip b{color:var(--navy)}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;text-decoration:none;
    padding:14px 24px;border-radius:999px;font-weight:600;font-size:14.5px;border:1px solid var(--navy)}
  .cta:hover{background:var(--navy2)}
  .cta.ghost{background:transparent;color:var(--navy);border-color:#C9BFB0;margin-left:10px}
  .note-small{font-size:12px;color:var(--muted);margin-top:12px}

  .price{background:var(--navy);color:#fff;border-radius:22px;padding:30px 28px;box-shadow:0 24px 50px rgba(15,39,64,.18)}
  .price .tag{display:inline-block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#E8CFA9;border:1px solid rgba(232,207,169,.45);border-radius:999px;padding:4px 10px;margin-bottom:18px}
  .price .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12)}
  .price .row:last-of-type{border-bottom:0}
  .price .k{font-size:12.5px;color:#C9D6E2}
  .price .v{font-family:Georgia,serif;font-size:26px;color:#fff;white-space:nowrap}
  .price .v small{font-size:12px;color:#C9D6E2;font-family:inherit}
  .price .total{margin-top:14px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:12.5px;color:#E7EEF5}
  .price .total b{color:#fff}
  .price ul{margin:18px 0 0;padding:0;list-style:none}
  .price li{position:relative;padding-left:20px;font-size:12.8px;color:#D7E1EA;margin:7px 0}
  .price li:before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;
    background:#E8CFA9}

  section.block{padding:44px 0 6px}
  h2{font-family:Georgia,serif;font-weight:500;color:var(--navy);font-size:clamp(22px,2.6vw,32px);margin:0 0 8px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .step .n{font-family:Georgia,serif;color:var(--copper);font-size:13px;letter-spacing:.12em}
  .step h3{font-size:15px;margin:8px 0 6px;color:var(--navy)}
  .step p{margin:0;font-size:13px;color:var(--muted)}
  .includes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .inc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
  .inc i{width:20px;height:20px;border-radius:50%;background:#EFE6D8;color:var(--copper2);font-style:normal;
    font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
  .inc span{font-size:13.5px;color:#33404D}
  .fair{background:#FFF9EF;border:1px solid #EBD9BC;border-radius:16px;padding:18px 20px;margin-top:18px}
  .fair h3{margin:0 0 6px;font-size:13.5px;color:#7A5526;letter-spacing:.04em}
  .fair p{margin:0;font-size:12.8px;color:#6C593E;line-height:1.7}

  .formcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;margin:14px 0 10px;
    box-shadow:0 14px 40px rgba(18,33,46,.06)}
  .formhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .formhead h2{margin:0 0 4px;font-size:24px}
  .formhead p{margin:0;color:var(--muted);font-size:13px}
  .reqhint{font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:6px}
  .formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  label{font-size:12.5px;font-weight:600;color:#3A4654}
  label .opt{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:4px}
  input,textarea{width:100%;padding:12px 13px;border:1px solid #D8D2C7;border-radius:11px;font:inherit;
    font-size:14px;background:#FDFCFA;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid rgba(181,114,63,.25);border-color:var(--copper)}
  textarea{min-height:96px;resize:vertical}
  .briefbox{margin-top:20px;padding-top:18px;border-top:1px dashed #D8D2C7}
  .briefhead{margin-bottom:12px}
  .briefhead h3{font-family:Georgia,serif;font-weight:500;font-size:17px;color:var(--navy);margin:0 0 3px}
  .briefhead p{margin:0;color:var(--muted);font-size:12.5px}
  .consent{display:flex;gap:10px;align-items:flex-start;margin:18px 0 6px;font-size:13px;color:#3A4654}
  .consent input{width:18px;height:18px;margin-top:2px;flex:0 0 auto;accent-color:var(--copper2)}
  .consent a{color:var(--copper2)}
  .errbox{display:none;background:#FDF0EE;border:1px solid #F0C9C2;color:#8E2F24;border-radius:11px;
    padding:11px 13px;font-size:13px;margin:10px 0 0}
  .errbox.show{display:block}
  .submitrow{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
  .submit{background:var(--copper);border:1px solid var(--copper);color:#fff;border-radius:999px;padding:13px 26px;
    font:600 14.5px/1 inherit;cursor:pointer;min-width:180px}
  .submit:hover{background:var(--copper2)}
  .submit:disabled{opacity:.6;cursor:wait}
  .privacy{font-size:11.5px;color:var(--muted)}

  .success{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 28px;text-align:center;
    margin:14px 0}
  .success.show{display:block}
  .success .tick{width:54px;height:54px;border-radius:50%;background:#E7F4EC;color:var(--ok);
    display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
  .success h2{margin:0 0 6px;font-size:26px}
  .success p{color:var(--muted);font-size:13.5px;margin:0 auto 8px;max-width:52ch}
  .orderbox{display:inline-block;background:var(--paper);border:1px dashed #C9BFB0;border-radius:12px;
    padding:12px 18px;font:600 19px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--navy);margin:12px 0}
  .success .meta{font-size:12.5px;color:var(--muted)}
  .success .meta b{color:var(--navy)}

  footer{border-top:1px solid var(--line);padding:26px 0 40px;margin-top:34px;color:var(--muted);font-size:12px}
  footer .fbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  footer a{color:var(--muted)}
  @media(max-width:900px){
    .hero{grid-template-columns:1fr;gap:26px}
    .grid3{grid-template-columns:1fr}
    .includes{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    header{padding:12px 0}
    .hero h1 em{display:block}
    .brand b{font-size:16px}
    .brand .sub{display:none}
    main{padding:28px 0 10px}
    h1{font-size:30px}
    .lead{font-size:15px}
    .cta,.cta.ghost{display:flex;justify-content:center;width:100%;margin:0 0 10px}
    .price{padding:24px 20px;border-radius:18px}
    .price .row{display:block;padding:10px 0}
    .price .k{display:block;margin-bottom:3px}
    .price .v{display:block;text-align:right;white-space:normal;font-size:23px}
    .price .v small{display:block;margin-top:2px}
    .formcard{padding:20px 16px;border-radius:18px}
    .formgrid{grid-template-columns:1fr}
    .formhead{flex-direction:column;gap:6px}
    .reqhint{padding-top:0}
    .submit{width:100%}
    .submitrow{gap:10px}
    section.block{padding:32px 0 4px}
    .orderbox{font-size:17px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="/">
      <img src="/icon-256.png?v=ord1" alt="RoofX">
      <span class="brandtext"><b>RoofX</b><span class="sub">Web Studio</span></span>
    </a>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="bm">BM</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1><span data-i18n="h1a"></span> <em data-i18n="h1b"></em></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="chips">
        <span class="chip"><b>RM1,500</b> <span data-i18n="chip_month"></span></span>
        <span class="chip"><b>RM2,500</b> <span data-i18n="chip_setup"></span></span>
        <span class="chip" data-i18n="chip_turnaround"></span>
      </div>
      <a class="cta" href="#order" data-i18n="cta_primary"></a>
      <a class="cta ghost" href="#included" data-i18n="cta_secondary"></a>
      <p class="note-small" data-i18n="hero_note"></p>
    </div>

    <aside class="price" aria-labelledby="pricetitle">
      <span class="tag" data-i18n="price_tag"></span>
      <div class="row">
        <span class="k" id="pricetitle" data-i18n="price_month_k"></span>
        <span class="v">RM1,500 <small data-i18n="per_month"></small></span>
      </div>
      <div class="row">
        <span class="k" data-i18n="price_setup_k"></span>
        <span class="v">RM2,500 <small data-i18n="one_time"></small></span>
      </div>
      <div class="total" data-i18n="price_total"></div>
      <ul>
        <li data-i18n="price_li1"></li>
        <li data-i18n="price_li2"></li>
        <li data-i18n="price_li3"></li>
      </ul>
    </aside>
  </div>

  <section class="block" id="included">
    <h2 data-i18n="inc_title"></h2>
    <p class="sub" data-i18n="inc_sub"></p>
    <div class="includes">
      <div class="inc"><i>01</i><span data-i18n="inc1"></span></div>
      <div class="inc"><i>02</i><span data-i18n="inc2"></span></div>
      <div class="inc"><i>03</i><span data-i18n="inc3"></span></div>
      <div class="inc"><i>04</i><span data-i18n="inc4"></span></div>
      <div class="inc"><i>05</i><span data-i18n="inc5"></span></div>
      <div class="inc"><i>06</i><span data-i18n="inc6"></span></div>
    </div>
    <div class="fair">
      <h3 data-i18n="fair_title"></h3>
      <p data-i18n="fair_body"></p>
    </div>
  </section>

  <section class="block">
    <h2 data-i18n="how_title"></h2>
    <p class="sub" data-i18n="how_sub"></p>
    <div class="grid3">
      <div class="step"><div class="n">01</div><h3 data-i18n="how1_t"></h3><p data-i18n="how1_d"></p></div>
      <div class="step"><div class="n">02</div><h3 data-i18n="how2_t"></h3><p data-i18n="how2_d"></p></div>
      <div class="step"><div class="n">03</div><h3 data-i18n="how3_t"></h3><p data-i18n="how3_d"></p></div>
    </div>
  </section>

  <section class="block" id="order">
    <div class="formcard" id="formcard">
      <div class="formhead">
        <div>
          <h2 data-i18n="form_title"></h2>
          <p data-i18n="form_sub"></p>
        </div>
        <div class="reqhint" data-i18n="req_hint"></div>
      </div>
      <form id="orderform" novalidate>
        <div class="formgrid">
          <div class="field">
            <label for="f_name"><span data-i18n="label_name"></span> *</label>
            <input id="f_name" name="name" type="text" autocomplete="name" maxlength="80" data-i18n-ph="ph_name">
          </div>
          <div class="field">
            <label for="f_phone"><span data-i18n="label_phone"></span> *</label>
            <input id="f_phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="32" data-i18n-ph="ph_phone">
          </div>
          <div class="field">
            <label for="f_email"><span data-i18n="label_email"></span><span class="opt" data-i18n="optional"></span></label>
            <input id="f_email" name="email" type="email" autocomplete="email" maxlength="120" data-i18n-ph="ph_email">
          </div>
          <div class="field">
            <label for="f_company"><span data-i18n="label_company"></span><span class="opt" data-i18n="optional"></span></label>
            <input id="f_company" name="company" type="text" autocomplete="organization" maxlength="120" data-i18n-ph="ph_company">
          </div>
          <div class="field">
            <label for="f_ren"><span data-i18n="label_ren"></span><span class="opt" data-i18n="optional"></span></label>
            <input id="f_ren" name="ren_no" type="text" maxlength="40" data-i18n-ph="ph_ren">
          </div>
          <div class="field">
            <label for="f_area"><span data-i18n="label_area"></span><span class="opt" data-i18n="optional"></span></label>
            <input id="f_area" name="area" type="text" maxlength="80" data-i18n-ph="ph_area">
          </div>
          <div class="field full">
            <label for="f_domain"><span data-i18n="label_domain"></span><span class="opt" data-i18n="optional"></span></label>
            <input id="f_domain" name="domain" type="text" maxlength="120" data-i18n-ph="ph_domain">
          </div>
          <div class="field full">
            <label for="f_notes"><span data-i18n="label_notes"></span><span class="opt" data-i18n="optional"></span></label>
            <textarea id="f_notes" name="notes" maxlength="1000" data-i18n-ph="ph_notes"></textarea>
          </div>
        </div>
        <div class="briefbox">
          <div class="briefhead">
            <h3 data-i18n="brief_title"></h3>
            <p data-i18n="brief_sub"></p>
          </div>
          <div class="formgrid">
            <div class="field full">
              <label for="b_goal" data-i18n="label_goal"></label>
              <textarea id="b_goal" name="b_goal" maxlength="500"></textarea>
            </div>
            <div class="field">
              <label for="b_pages" data-i18n="label_pages"></label>
              <input id="b_pages" name="b_pages" type="text" maxlength="500">
            </div>
            <div class="field">
              <label for="b_listing_count" data-i18n="label_listing_count"></label>
              <input id="b_listing_count" name="b_listing_count" type="number" min="0" step="1" inputmode="numeric">
            </div>
            <div class="field">
              <label for="b_listing_source" data-i18n="label_listing_source"></label>
              <input id="b_listing_source" name="b_listing_source" type="text" maxlength="500">
            </div>
            <div class="field">
              <label for="b_logo_url" data-i18n="label_logo_url"></label>
              <input id="b_logo_url" name="b_logo_url" type="url" maxlength="500">
            </div>
            <div class="field">
              <label for="b_brand_color" data-i18n="label_brand_color"></label>
              <input id="b_brand_color" name="b_brand_color" type="text" maxlength="500">
            </div>
            <div class="field">
              <label for="b_reference_url" data-i18n="label_reference_url"></label>
              <input id="b_reference_url" name="b_reference_url" type="url" maxlength="500">
            </div>
            <div class="field full">
              <label for="b_asset_links" data-i18n="label_asset_links"></label>
              <textarea id="b_asset_links" name="b_asset_links" maxlength="2000" data-i18n-ph="ph_asset_links"></textarea>
            </div>
            <div class="field full">
              <label for="b_target_launch" data-i18n="label_target_launch"></label>
              <input id="b_target_launch" name="b_target_launch" type="text" maxlength="500" placeholder="2026-12-01">
            </div>
          </div>
        </div>
        <label class="consent" for="f_contract">
          <input id="f_contract" name="contract_accepted" type="checkbox">
          <span><span data-i18n="consent_a"></span> <a href="/terms/" target="_blank" rel="noopener" data-i18n="consent_link"></a></span>
        </label>
        <div class="errbox" id="errbox" role="alert"></div>
        <div class="submitrow">
          <button class="submit" id="submitbtn" type="submit" data-i18n="submit"></button>
          <span class="privacy" data-i18n="privacy"></span>
        </div>
      </form>
    </div>

    <div class="success" id="success" role="status" aria-live="polite">
      <div class="tick">✓</div>
      <h2 data-i18n="success_title"></h2>
      <p data-i18n="success_body"></p>
      <div class="orderbox" id="orderno">—</div>
      <p class="meta"><span data-i18n="success_status"></span>: <b id="orderstatus">—</b></p>
      <p class="meta"><span data-i18n="success_prices"></span></p>
      <p class="meta" data-i18n="success_next"></p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap fbar">
    <span data-i18n="footer_note"></span>
    <a href="/terms/" data-i18n="footer_terms"></a>
    <a href="/privacy/" data-i18n="footer_privacy"></a>
    <span style="margin-left:auto">© <span id="year">2026</span> RoofX Web Studio</span>
  </div>
</footer>

<script>
(function () {
  "use strict";
  var INDEX = { zh: 0, en: 1, bm: 2 };
  var I18N = {
    page_title: ["房产中介建站 · RoofX Web Studio", "Websites for property agents · RoofX Web Studio", "Laman web untuk ejen hartanah · RoofX Web Studio"],
    meta_desc: ["房产中介专属建站服务：首月 RM2,500（含建站 + 首月服务），之后 RM1,500/月。专属设计、域名、托管、房源同步与 WhatsApp 直达。",
      "Property agent websites: first month RM2,500 (setup + first month), then RM1,500/month. Dedicated design, domain, hosting, listing sync and WhatsApp.",
      "Laman web ejen hartanah: bulan pertama RM2,500 (penyediaan + bulan pertama), kemudian RM1,500/bulan. Reka bentuk khusus, domain, hosting, penyegerakan senarai dan WhatsApp."],
    eyebrow: ["房产中介建站服务", "Website service for property agents", "Perkhidmatan laman web untuk ejen hartanah"],
    h1a: ["一个真正", "A website", "Laman web"],
    h1b: ["属于你的房产网站", "that is truly yours", "yang benar-benar milik anda"],
    lead: ["专属设计、房源同步、WhatsApp 直达，一个工作日内对接。你专注带看与成交，网站交给我们。",
      "Dedicated design, listing sync and WhatsApp click-to-chat. We reply within one business day, so you can focus on viewings and closing.",

  var q = new URLSearchParams(location.search);
  var lang = q.get("lang") || localStorage.getItem("kt_lang") || localStorage.getItem("kwongthye_lang") || "zh";
  if (!INDEX.hasOwnProperty(lang)) lang = "zh";

  function t(key) {
    var v = I18N[key];
    return v ? (v[INDEX[lang]] || v[0]) : key;
  }

  function apply() {
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = t("page_title");
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute("content", t("meta_desc"));
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (I18N[k]) el.textContent = t(k);
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
      var k = el.getAttribute("data-i18n-ph");
      if (I18N[k]) el.setAttribute("placeholder", t(k));
    });
    document.querySelectorAll("#langs button").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-lang") === lang);
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    if (lastOrder) {
      document.getElementById("orderstatus").textContent = t("st_" + lastOrder.status) || lastOrder.status;
    }
  }

  function setLang(next) {
    if (!INDEX.hasOwnProperty(next)) return;
    lang = next;
    try { localStorage.setItem("kt_lang", lang); localStorage.setItem("kwongthye_lang", lang); } catch (e) {}
    try {
      var u = new URL(location.href);
      u.searchParams.set("lang", lang);
      history.replaceState(null, "", u.toString());
    } catch (e) {}
    apply();
  }

  document.getElementById("langs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (b) setLang(b.getAttribute("data-lang"));
  });

  var lastOrder = null;
  var form = document.getElementById("orderform");
  var errbox = document.getElementById("errbox");
  var btn = document.getElementById("submitbtn");
  var submitLabel = "submit";

  function showErr(msg) {
    errbox.textContent = msg;
    errbox.classList.add("show");
  }
  function clearErr() {
    errbox.textContent = "";
    errbox.classList.remove("show");
  }
  function focusField(name) {
    if (name === "brief") {
      var first = document.getElementById("b_goal") || form.querySelector('[name^="b_"]');
      if (first) first.focus();
      return;
    }
    var el = form.querySelector('[name="' + name + '"]');
    if (el) el.focus();
  }
  function fieldError(field) {
    if (field === "name") return t("err_name");
    if (field === "phone") return t("err_phone");
    if (field === "email") return t("err_email");
    if (field === "domain") return t("err_domain");
    if (field === "contract_accepted") return t("err_consent");
    if (field === "brief") return t("err_brief");
    return t("err_generic");
  }

  // 建站需求 brief：只收非空值；domain/notes 复用顶层输入（冻结修订 A1）
  function buildBrief() {
    function raw(id) {
      var node = document.getElementById(id);
      return node ? String(node.value == null ? "" : node.value).trim() : "";
    }
    function putText(target, key, value) {
      var v = String(value == null ? "" : value).trim();
      if (v) target[key] = v;
    }
    var brief = {};
    putText(brief, "goal", raw("b_goal"));
    putText(brief, "pages", raw("b_pages"));
    var countRaw = raw("b_listing_count");
    if (countRaw !== "") {
      var count = Number(countRaw);
      if (isFinite(count)) brief.listing_count = count;
    }
    putText(brief, "listing_source", raw("b_listing_source"));
    putText(brief, "logo_url", raw("b_logo_url"));
    putText(brief, "brand_color", raw("b_brand_color"));
    putText(brief, "reference_url", raw("b_reference_url"));
    var assets = raw("b_asset_links").split(/[\n,]/).map(function (s) { return s.trim(); })
      .filter(function (s) { return !!s; }).slice(0, 10);
    if (assets.length) brief.asset_links = assets;
    putText(brief, "target_launch", raw("b_target_launch"));
    putText(brief, "domain", form.elements["domain"].value);
    putText(brief, "notes", form.elements["notes"].value);
    return brief;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    clearErr();
    var data = {
      name: form.elements["name"].value,
      phone: form.elements["phone"].value,
      email: form.elements["email"].value,
      company: form.elements["company"].value,
      ren_no: form.elements["ren_no"].value,
      area: form.elements["area"].value,
      domain: form.elements["domain"].value,
      notes: form.elements["notes"].value,
      contract_accepted: form.elements["contract_accepted"].checked
    };
    data.brief = buildBrief();
    if (!data.name.trim()) { showErr(t("err_name")); focusField("name"); return; }
    if (!data.phone.trim()) { showErr(t("err_phone")); focusField("phone"); return; }
    if (!data.contract_accepted) { showErr(t("err_consent")); focusField("contract_accepted"); return; }

    btn.disabled = true;
    submitLabel = btn.getAttribute("data-i18n");
    btn.textContent = t("submitting");

    fetch("/api/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(data)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        return { status: res.status, body: body };
      });
    }).then(function (r) {
      if (r.status === 201 || r.status === 200) {
        lastOrder = r.body.order || null;
        if (!lastOrder) throw new Error("bad_response");
        document.getElementById("orderno").textContent = lastOrder.order_no;
        document.getElementById("orderstatus").textContent = t("st_" + lastOrder.status) || lastOrder.status;
        document.getElementById("formcard").hidden = true;
        document.getElementById("success").classList.add("show");
        document.getElementById("success").scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      if (r.status === 429) { showErr(t("err_rate")); return; }
      if (r.body && r.body.error === "invalid_input") {
        showErr(fieldError(r.body.field));
        focusField(r.body.field);
        return;
      }
      showErr(t("err_generic"));
    }).catch(function () {
      showErr(t("err_network"));
    }).then(function () {
      btn.disabled = false;
      btn.setAttribute("data-i18n", submitLabel);
      btn.textContent = t(submitLabel);
    });
  });

  document.getElementById("year").textContent = String(new Date().getFullYear());
  apply();
})();
