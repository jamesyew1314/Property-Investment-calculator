<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房源池 · RoofX</title>
<meta name="description" content="柔佛同行房源池：无需登录浏览全部货源，登录后发布自己的房源。WTS / WTL 合作共赢。">
<link rel="stylesheet" href="/site.css?v=20261107a">
<style>
  .poolHead{padding:34px 0 22px;background:linear-gradient(180deg,#0E2438,#16324B);color:#fff}
  .poolHead h1{font-family:Georgia,serif;font-size:32px;margin:0 0 6px}
  .poolHead p{margin:0;color:#C9D6E4;font-size:14px}
  .poolBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
  .poolBar input,.poolBar select{flex:1 1 200px;min-width:0;padding:11px 12px;border:1px solid #D6DCE7;border-radius:10px;font:inherit;font-size:15px;background:#fff}
  .seg{display:inline-flex;border:1px solid #D6DCE7;border-radius:10px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:10px 14px;font:inherit;font-size:13.5px;cursor:pointer}
  .seg button.on{background:#0E2438;color:#fff}
  .poolGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 8px}
  .plCard{background:#fff;border:1px solid #E3E8F0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .plCard img{width:100%;height:170px;object-fit:cover;display:block;background:#EEF1F6}
  .plBody{padding:13px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
  .plTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .plCode{font:600 12px ui-monospace,Menlo,monospace;color:#6B7A8D}
  .plTag{font-size:11px;padding:3px 8px;border-radius:999px;background:#F1EDE3;color:#7A5B1E}
  .plTag.rent{background:#E7F1EA;color:#2C6B45}
  .plTitle{font-weight:700;color:#0E2438;font-size:16px;line-height:1.35}
  .plMeta{font-size:12.5px;color:#67768A}
  .plPrice{font:700 18px Georgia,serif;color:#0E2438}
  .plAgent{margin-top:auto;border-top:1px solid #EEF1F6;padding-top:9px;font-size:12px;color:#4C5B6E;line-height:1.5}
  .plActions{display:flex;gap:8px;margin-top:8px}
  .plActions .btn{flex:1;min-height:42px;font-size:13px}
  .rules{margin:34px 0 10px;background:#fff;border:1px solid #E3E8F0;border-radius:16px;padding:18px}
  .rules h2{margin:0 0 6px;font-family:Georgia,serif;color:#0E2438}
  .rules .tabs{display:flex;gap:6px;margin:10px 0}
  .rules .tabs button{border:1px solid #D6DCE7;background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
  .rules .tabs button.on{background:#0E2438;color:#fff;border-color:#0E2438}
  .rules .body{white-space:pre-line;font-size:13.5px;line-height:1.9;color:#33455A}
  .poolEmpty{padding:36px 12px;text-align:center;color:#67768A}
  .headActs{display:flex;align-items:center;gap:8px}
  .langs{display:flex;gap:2px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px}
  .langs button{border:0;background:transparent;color:#D5E0EC;font:600 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;padding:6px 9px;border-radius:999px;cursor:pointer}
  .langs button.on{background:#fff;color:#0E2438}
  @media(max-width:1000px){.poolGrid{grid-template-columns:1fr 1fr}}
  @media(max-width:760px){
    .poolHead{padding:24px 0 16px}.poolHead h1{font-size:24px}
    .headActs .btn{padding:9px 10px;font-size:12px}
    .langs button{padding:6px 7px}
    .headActs{gap:6px}
    .poolGrid{grid-template-columns:1fr}
    .poolBar input,.poolBar select{flex:1 1 100%}
  }
  @media(max-width:430px){
    .headActs .btn{display:none}
    .langs button{padding:5px 6px;font-size:10.5px}
    .poolGrid{grid-template-columns:1fr}
    .poolBar input,.poolBar select{flex:1 1 100%}
    .seg{width:100%}.seg button{flex:1}
    .plCard img{height:200px}
    .rules{padding:14px}
  }
.site-head{position:sticky;top:0;z-index:60}

/* TECH UI pool */
.poolHead{background:
 radial-gradient(600px 260px at 85% 0%,rgba(198,161,91,.16),transparent 60%),
 linear-gradient(180deg,#0A1B2B,#122E47)!important;position:relative;overflow:hidden}
.poolHead:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 80%);pointer-events:none}
.poolBar input,.poolBar select{background:rgba(255,255,255,.95)!important;border:1px solid rgba(198,161,91,.2)!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.plCard{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(12px);border:1px solid rgba(198,161,91,.18)!important;border-radius:18px!important;box-shadow:0 16px 36px rgba(14,36,56,.08);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.plCard:hover{transform:translateY(-4px);border-color:rgba(198,161,91,.5)!important;box-shadow:0 26px 52px rgba(14,36,56,.15)}
.plCode{color:#B8862F!important;letter-spacing:.05em}
.plPrice{color:#B8862F!important}
.plTag{border:1px solid rgba(198,161,91,.25)!important}
.rules{background:rgba(255,255,255,.92)!important;backdrop-filter:blur(12px);box-shadow:0 16px 36px rgba(14,36,56,.07)}
</style>

<link rel="stylesheet" href="/neo.css">
</head>
<body class="neo">
<header class="site-head">
  <div class="wrap bar">
    <a class="brand" href="/" aria-label="RoofX"><img src="/logo.png?v=tr1" alt="" onerror="this.style.display='none'"><span><b>RoofX</b></span></a>
    <nav class="site-nav" id="nav">
      <a href="/" id="navHome">首页</a>
      <a href="/pool/" class="on" id="navPool">房源池</a>
      <a href="/agents/" id="navAgents">中介简介</a>
      <a href="/join/" id="navJoin">中介注册</a>
    </nav>
    <div class="headActs">
      <div class="langs" id="langs"><button type="button" data-l="zh">中文</button><button type="button" data-l="en">EN</button><button type="button" data-l="bm">BM</button></div>
      <a class="btn line sm" href="/agent/">登录 / 发布</a>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<section class="poolHead">
  <div class="wrap">
    <h1 id="poolTitle">房源池</h1>
    <p id="poolSub">无需登录，浏览全部同行货源 · 登录后发布你的房源</p>
  </div>
</section>

<main class="wrap">
  <div class="poolBar">
    <div class="seg" id="seg">
      <button data-intent="" class="on">全部</button>
      <button data-intent="sale">出售 WTS</button>
      <button data-intent="rent">出租 WTL</button>
    </div>
    <button type="button" id="dealBtn" style="border:1px solid #D6DCE7;background:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-size:13px;cursor:pointer">🔥 <span id="dealTxt">低于估价 20%</span></button>
    <input id="q" type="search" placeholder="搜索编号 / 楼盘 / 地址">
    <select id="area"><option value="">全部区域</option></select>
  </div>
  <div id="count" class="plMeta" style="margin:6px 0 0"></div>
  <div id="grid" class="poolGrid"></div>
  <div id="empty" class="poolEmpty" hidden>还没有货源，稍后再来看看。</div>

  <section class="rules">
    <h2 id="stdTitle">发布规范</h2>
    <ul id="stdList" style="margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.9;color:#33455A"></ul>
    <p class="muted" id="stdNote" style="margin:10px 0 0;font-size:12px">发布前需登录中介账号；资料不全的房源不会进入房源池。</p>
  </section>
</main>

<footer class="site-foot"><div class="wrap"><p class="muted" style="margin:0;padding:22px 0;font-size:12px">© 2026 RoofX · THE ROOF PROPERTY EXCHANGE</p></div></footer>

<script>
var _q=new URLSearchParams(location.search);
var LANG = _q.get('lang') || localStorage.getItem('kt_lang') || 'zh';
var INIT = { area: _q.get('area') || '', intent: _q.get('intent') || '', q: _q.get('q') || '', type: _q.get('type') || '', min: Number(_q.get('min')) || 0, max: Number(_q.get('max')) || 0, deal: _q.get('deal') === '1' };
var AREAS = [];
var ROWS = [];
var T = {
  zh: { title:'房源池', sub:'无需登录，浏览全部同行货源 · 登录后发布你的房源', all:'全部', sale:'出售 WTS', rent:'出租 WTL', q:'搜索编号 / 楼盘 / 地址', area:'全部区域', count:'共 {n} 条货源', login:'登录 / 发布', wa:'WhatsApp 联系', rules:'WhatsApp 群规', join:'加入 WhatsApp 群', empty:'还没有货源，稍后再来看看。', noArea:'区域待补', deal:'低于估价 20%', verified:'已验证', title:'房源池 · RoofX', home:'首页', navPool:'房源池', navAgents:'中介简介', navJoin:'中介注册', bank:'银行估价', below:'低于估价', bed:'房', bath:'卫', areaPending:'区域待补' },
  en: { title:'Listing Pool', sub:'Browse every co-broke listing without logging in · Log in to post yours', all:'All', sale:'Sale WTS', rent:'Rent WTL', q:'Search code / project / address', area:'All areas', count:'{n} listings', login:'Login / Post', wa:'WhatsApp', rules:'WhatsApp group rules', join:'Join WhatsApp group', empty:'No listings yet — check back soon.', noArea:'Area pending', deal:'20% below valuation', verified:'Verified', title:'Listing Pool · RoofX', home:'Home', navPool:'Listings', navAgents:'Agent profiles', navJoin:'Agent registration', bank:'Bank value', below:'below valuation', bed:'bed', bath:'bath', areaPending:'Area pending' },
  bm: { title:'Kolam Senarai', sub:'Lihat semua senarai rakan tanpa log masuk · Log masuk untuk siar', all:'Semua', sale:'Jual WTS', rent:'Sewa WTL', q:'Cari kod / projek / alamat', area:'Semua kawasan', count:'{n} senarai', login:'Log Masuk / Siar', wa:'WhatsApp', rules:'Peraturan kumpulan WhatsApp', join:'Sertai kumpulan WhatsApp', empty:'Belum ada senarai — semak semula nanti.', noArea:'Kawasan belum diisi', deal:'20% bawah penilaian', verified:'Disahkan', title:'Kolam Senarai · RoofX', home:'Utama', navPool:'Kolam', navAgents:'Profil ejen', navJoin:'Pendaftaran ejen', bank:'Nilai bank', below:'bawah penilaian', bed:'bilik', bath:'bilik air', areaPending:'Kawasan belum diisi' }
};
var STD = {
zh:["只发布 WTS 出售 / WTL 出租，不发布 WTB / WTR","必须填写：照片、价格、区域、面积或房型、公司与 REN、联系电话","合作分佣默认 A+B ÷ 2；如有 referral fee，请在个人资料中注明","资料不全或违规，平台会下架并要求补充"],
en:["Post WTS (sale) and WTL (rent) only — no WTB / WTR","Required: photos, price, area, size or layout, company & REN, contact number","Co-broke commission defaults to A+B ÷ 2; declare any referral fee in your profile","Incomplete or non-compliant listings will be unpublished"],
bm:["Siar WTS (jual) dan WTL (sewa) sahaja — tiada WTB / WTR","Wajib: gambar, harga, kawasan, saiz atau susun atur, syarikat & REN, nombor telefon","Komisen co-broke lalai A+B ÷ 2; nyatakan referral fee dalam profil","Senarai tidak lengkap atau melanggar akan dinyahsiar"]
};
var STD_NOTE={zh:"发布前需登录中介账号；资料不全的房源不会进入房源池。",en:"Log in to post. Incomplete listings will not enter the pool.",bm:"Log masuk untuk siar. Senarai tidak lengkap tidak akan masuk kolam."};
function t(k){ return (T[LANG]||T.zh)[k]; }
function areaLabel(code){ if(!code) return t('areaPending'); var a=(AREAS||[]).filter(function(x){return x.key===code;})[0]; if(!a) return code; return LANG!=='zh'?(a.en||a.zh):(a.zh||a.en); }
function money(v, rent){ if(v==null) return '—'; return 'RM ' + Number(v).toLocaleString('en-MY') + (rent?'/mo':''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
window.__pnSetLang=function(l){
  LANG=(['zh','en','bm'].indexOf(l)>=0)?l:'zh';
  try{localStorage.setItem('kt_lang',LANG);localStorage.setItem('kwongthye_lang',LANG);}catch(e){}
  try{var u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(null,'',u.toString());}catch(e){}
  apply(); render();
};
function apply(){
  document.title = t('title');
  document.documentElement.lang = LANG==='zh'?'zh-CN':(LANG==='bm'?'ms':'en');
  document.getElementById('poolTitle').textContent=t('title');
  document.getElementById('poolSub').textContent=t('sub');
  document.getElementById('q').placeholder=t('q');
  [['navHome','home'],['navPool','navPool'],['navAgents','navAgents'],['navJoin','navJoin']].forEach(function(x){var el=document.getElementById(x[0]); if(el) el.textContent=t(x[1]);});
  var _dt=document.getElementById('dealTxt'); if(_dt) _dt.textContent=t('deal');
  document.getElementById('stdTitle').textContent=LANG==='zh'?'发布规范':(LANG==='bm'?'Peraturan siaran':'Posting standards');
  document.getElementById('stdList').innerHTML=(STD[LANG]||STD.zh).map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
  document.getElementById('stdNote').textContent=(STD_NOTE[LANG]||STD_NOTE.zh);
  document.querySelector('#seg [data-intent=""]').textContent=t('all');
  document.querySelector('#seg [data-intent="sale"]').textContent=t('sale');
  document.querySelector('#seg [data-intent="rent"]').textContent=t('rent');
  document.querySelector('#area option').textContent=t('area');
  document.querySelector('.headActs .btn').textContent=t('login');
  render();
}
function render(){
  var q=document.getElementById('q').value.toLowerCase().trim();
  var area=document.getElementById('area').value;
  var intent=document.querySelector('#seg button.on').dataset.intent;
  var dealOnly=document.getElementById('dealBtn').classList.contains('on');
  var list=ROWS.filter(function(r){
    if(dealOnly){ if(!(Number(r.bank_value)>0 && Number(r.asking_price)>0 && Number(r.asking_price)<=Number(r.bank_value)*0.8)) return false; }
    if(intent && r.intent!==intent) return false;
    if(INIT.type && r.property_type!==INIT.type) return false;
    var pv=Number(r.asking_price||r.rent_price||0);
    if(INIT.min && pv<INIT.min) return false;
    if(INIT.max && pv>INIT.max) return false;
    if(area && r.area_code!==area) return false;
    if(q){ var hay=(r.code+' '+(r.address_text||'')+' '+(r.project_name||'')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  document.getElementById('count').textContent=t('count').replace('{n}', list.length);
  document.getElementById('empty').hidden = list.length>0; document.getElementById('empty').textContent=t('empty'); document.title=T[LANG].title;
  document.getElementById('grid').innerHTML = list.map(function(r){
    var rent=r.intent==='rent';
    var price=rent?r.rent_price:r.asking_price;
    var img=r.cover_url || (Array.isArray(r.photos)&&r.photos[0]) || '';
    var phone=String(r.agent_phone||'').replace(/[^0-9]/g,'').replace(/^0/,'60');
    var wa='https://wa.me/'+phone+'?text='+encodeURIComponent('Hi '+ (r.agent_name||'') +', 我在 RoofX 看到 '+r.code);
    return '<article class="plCard">'+(img?'<img src="'+esc(img)+'" loading="lazy" alt="">':'')+
      '<div class="plBody"><div class="plTop"><span class="plCode">'+esc(r.code)+'</span><span class="plTag '+(rent?'rent':'')+'">'+(rent?t('rent'):t('sale'))+'</span></div>'+
      '<div class="plTitle">'+esc(r.project_name||r.address_text||r.code)+'</div>'+
      (Number(r.bank_value)>0?'<div class="plMeta">'+t('bank')+' RM '+Number(r.bank_value).toLocaleString('en-MY')+(Number(r.asking_price)>0?' · '+(Number(r.asking_price)<=Number(r.bank_value)*0.8?t('below')+' '+Math.round((1-Number(r.asking_price)/Number(r.bank_value))*100)+'%':'') :'')+'</div>':'')+
      '<div class="plMeta">'+esc(areaLabel(r.area_code))+(r.bedrooms!=null?' · '+r.bedrooms+' '+t('bed'):'')+(r.bathrooms!=null?' / '+r.bathrooms+' '+t('bath'):'')+(r.built_up?' · '+Number(r.built_up).toLocaleString('en-MY')+' sqft':'')+'</div>'+
      '<div class="plPrice">'+(Number(r.price_total)>0?money(Number(r.price_total))+'<div class="plMeta" style="font-size:11px">'+(LANG==='zh'?'总价':(LANG==='bm'?'Jumlah':'Total'))+' · RM '+Number(r.asking_price).toLocaleString('en-MY')+'/psf</div>':(r.price_unit==='psf'?money(price)+'/psf':money(price,rent)))+'</div>'+
      (r.cobroke_note?'<div class="plMeta">合作：'+esc(r.cobroke_note)+'</div>':'')+
      '<div class="plAgent"><b>'+esc(r.agent_name||'')+'</b>'+(r.agent_team?' · '+esc(r.agent_team):'')+(r.agent_ren?' · REN '+esc(r.agent_ren):'')+(r.agent_verified?' · '+t('verified'):'')+'</div>'+
      '<div class="plActions"><a class="btn line" href="/p/'+encodeURIComponent(r.code)+'">'+(LANG==='zh'?'查看详情':(LANG==='bm'?'Lihat butiran':'View details'))+'</a>'+(phone?'<a class="btn gold" href="'+wa+'" target="_blank" rel="noopener">'+t('wa')+'</a>':'')+'</div>'+
      '</div></article>';
  }).join('');
}
document.getElementById('seg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); render();
});
document.getElementById('dealBtn').addEventListener('click',function(){ this.classList.toggle('on'); this.style.background=this.classList.contains('on')?'#0E2438':'#fff'; this.style.color=this.classList.contains('on')?'#fff':'#0E2438'; render(); });
document.getElementById('q').addEventListener('input',render);
document.getElementById('area').addEventListener('change',render);

document.querySelectorAll('#langs button').forEach(function(b){
  b.classList.toggle('on', b.dataset.l===LANG);
  b.addEventListener('click', function(){ try{localStorage.setItem('kt_lang',b.dataset.l);}catch(e){}; location.href='?lang='+b.dataset.l; });
});
document.getElementById('menuBtn').addEventListener('click',function(){ document.getElementById('nav').classList.toggle('open'); this.setAttribute('aria-expanded',document.getElementById('nav').classList.contains('open')); });

fetch('/api/public/config').then(function(r){return r.json();}).then(function(cfg){
  AREAS=(cfg.areas||[]).filter(function(a){return a.state==='johor';});
  var sel=document.getElementById('area');
  AREAS.forEach(function(a){ var o=document.createElement('option'); o.value=a.key; o.textContent=LANG!=='zh'?a.en:a.zh; sel.appendChild(o); });
  if (INIT.area) sel.value = INIT.area;
  if (typeof render === 'function' && ROWS.length) render();
}).catch(function(){});
fetch('/api/public/pool').then(function(r){return r.json();}).then(function(d){
  ROWS=d.rows||[];
  if (INIT.deal) { var _db=document.getElementById('dealBtn'); _db.classList.add('on'); _db.style.background='#0E2438'; _db.style.color='#fff'; }
  if (INIT.q) document.getElementById('q').value = INIT.q;
  if (INIT.intent) document.querySelectorAll('#seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.intent===INIT.intent); });
  apply();
}).catch(function(){ apply(); });
</script>
<script src="/lang3.js"></script>
</body>
