<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E2438">
<title>房产资料库 PropBase — KWONG THYE</title>
<link rel="icon" type="image/png" href="/icon-256.png">
<link rel="manifest" href="/library/manifest.webmanifest">
<style>
:root{
  --navy:#0E2438;--navy2:#15344F;--gold:#C6A15B;--gold2:#E2C88F;
  --ink:#1B2430;--muted:#5D6B7A;--line:#E2E6EE;--bg:#F6F7FB;--white:#fff;
  --green:#166E52;--amber:#9A6A12;--red:#B23B3B;--blue:#2E5496;--r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--blue);text-decoration:none}
button{font:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ---------- 登录 ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,#1B3D5C 0%,var(--navy) 55%,#0A1B2A 100%)}
.gateCard{width:min(420px,100%);background:var(--white);border-radius:18px;padding:30px 28px 24px;
  box-shadow:0 30px 70px rgba(0,0,0,.35);border-top:3px solid var(--gold)}
.gateCard .lg{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.gateCard .lg img{width:42px;height:42px;border-radius:10px;background:var(--navy);padding:5px}
.gateCard .lg b{font-family:Georgia,serif;font-size:17px;letter-spacing:.06em;color:var(--navy);display:block}
.gateCard .lg span{font-size:11.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.gateCard h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
.gateCard p.sub{margin:0 0 18px;color:var(--muted);font-size:12.5px}
.gateCard label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.gateCard input[type=email],.gateCard input[type=password],.gateCard input[type=text]{
  width:100%;padding:11px 12px;border:1px solid #D6DCE7;border-radius:9px;background:#FCFDFF}
.gateCard input:focus{outline:2px solid rgba(198,161,91,.45);border-color:var(--gold)}
.gateCard .btn{width:100%;margin-top:16px;justify-content:center}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.chk input{width:15px;height:15px;accent-color:var(--gold)}
.gateMsg{min-height:18px;font-size:12.5px;margin-top:10px;color:var(--red)}
.gateMsg.ok{color:var(--green)}
.gateFoot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gateFoot button{border:none;background:none;color:var(--blue);cursor:pointer;font-size:11.5px;padding:0}

/* ---------- 布局 ---------- */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
#side{background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{width:34px;height:34px;border-radius:8px;background:#fff;padding:4px}
.brand b{font-family:Georgia,serif;font-size:14px;letter-spacing:.05em;display:block;line-height:1.2}
.brand span{font-size:10px;letter-spacing:.16em;color:var(--gold2);text-transform:uppercase}
nav{flex:1;padding:12px 10px;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#C9D6E3;font-size:13px;
  margin-bottom:2px;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.06);color:#fff}
nav a.on{background:rgba(198,161,91,.14);color:#fff;border-left-color:var(--gold);font-weight:600}
nav a svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
nav a .n{margin-left:auto;font-size:11px;color:var(--gold2);background:rgba(0,0,0,.25);padding:1px 7px;border-radius:999px}
.sideFoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#9FB3C6}
.sideFoot .who{display:block;color:#fff;font-size:12px;word-break:break-all;margin-bottom:2px}
.sideFoot .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sideFoot button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;
  padding:4px 10px;font-size:11px;cursor:pointer}
.sideFoot button:hover{border-color:var(--gold);color:var(--gold2)}

#main{min-width:0;display:flex;flex-direction:column}
#top{background:var(--white);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;
  gap:12px;position:sticky;top:0;z-index:20}
#top .t{min-width:0}
#top h1{font-size:18px;margin:0;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sub{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sp{margin-left:auto}
#burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:16px;line-height:1}
#view{padding:20px 22px 60px;max-width:1440px;width:100%}

/* ---------- 通用 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:1px solid var(--navy);
  border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B2430}
.btn.gold:hover{background:#D3B173}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);background:#FFFDF7}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.danger{background:#fff;color:var(--red);border-color:#E7C4C4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 12px;font-size:13px;color:var(--navy);letter-spacing:.04em;text-transform:uppercase}
.card h3 .muted{text-transform:none;letter-spacing:0;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.85}
.stat b{display:block;font-family:Georgia,serif;font-size:22px;color:var(--navy);line-height:1.2;margin-bottom:2px}
.stat span{font-size:11.5px;color:var(--muted)}
.stat small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.empty{padding:44px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--navy);font-size:15px;margin-bottom:6px}

/* ---------- 工具条 / 表格 ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar input[type=text],.toolbar select{
  padding:8px 10px;border:1px solid #D6DCE7;border-radius:9px;background:#fff;font-size:13px;min-width:120px}
.toolbar input[type=search]{min-width:250px;flex:1 1 250px}
.toolbar .grow{flex:1}
.toolbar .count{font-size:12px;color:var(--muted);margin-left:auto}
.tblWrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:9px 11px;text-align:left;border-bottom:1px solid #EEF1F6;vertical-align:middle}
table.tbl th{background:#F8FAFD;color:var(--navy);font-size:11.5px;font-weight:700;letter-spacing:.03em;
  position:sticky;top:0;z-index:1;white-space:nowrap;cursor:pointer;user-select:none}
table.tbl th.noSort{cursor:default}
table.tbl th .ar{color:var(--gold);font-size:10px;margin-left:3px}
table.tbl tbody tr:hover{background:#FCFAF4;cursor:pointer}
table.tbl tbody tr.sel{background:#FFF7E6}
table.tbl td .sub{display:block;font-size:11px;color:var(--muted);margin-top:1px}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl input[type=checkbox]{width:15px;height:15px;accent-color:var(--gold)}
.pager{display:flex;align-items:center;gap:8px;margin-top:12px;justify-content:flex-end;font-size:12.5px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.bulkbar{display:flex;gap:10px;align-items:center;background:#FFF8E8;border:1px solid #EBD9AE;border-radius:10px;
  padding:8px 12px;margin-bottom:10px;font-size:12.5px;flex-wrap:wrap}

.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap;background:#EEF2F8;color:#456}
.pill.green{background:#E8F5EE;color:var(--green)}
.pill.amber{background:#FBF1DC;color:var(--amber)}
.pill.grey{background:#EEF0F3;color:#667}
.pill.blue{background:#E9EFF9;color:var(--blue)}
.pill.red{background:#FBEAEA;color:var(--red)}
.tag{display:inline-block;background:#F3F5F9;border:1px solid #E6EAF1;border-radius:6px;padding:1px 6px;font-size:11px;color:#475467;margin:0 4px 4px 0}

/* ---------- 详情 ---------- */
.detailHead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.detailHead .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.detailHead h2{margin:2px 0 4px;font-size:22px;color:var(--navy)}
.detailHead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 18px}
.kv div{min-width:0}
.kv dt{font-size:11px;color:var(--muted);margin-bottom:1px}
.kv dd{margin:0;font-size:13.5px;color:var(--ink);word-break:break-word}
.hr{height:1px;background:var(--line);margin:16px 0}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{padding:9px 10px;border:1px solid #D6DCE7;border-radius:8px;background:#FCFDFF;font-size:13px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(198,161,91,.4);border-color:var(--gold)}
.field textarea{min-height:74px;resize:vertical}
.field .hint{font-size:11px;color:var(--muted)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:#D08C8C;background:#FFF8F8}
.field .err{font-size:11px;color:var(--red)}
.formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.formGrid .span2{grid-column:span 2}
.formGrid .span3{grid-column:span 3}
.formSec{margin:18px 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* ---------- 弹窗 ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.on{display:block}
.ovl{position:absolute;inset:0;background:rgba(14,36,56,.55);backdrop-filter:blur(2px)}
.dlg{position:relative;background:#fff;border-radius:16px;width:min(860px,94vw);max-height:92vh;margin:4vh auto;
  display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.dlg header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg header h2{margin:0;font-size:16px;color:var(--navy)}
.dlg header .x{margin-left:auto;border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
.dlg .body{padding:18px 20px;overflow:auto}
.dlg footer{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.dlg footer .msg{margin-right:auto;font-size:12px;color:var(--red)}

/* ---------- Toast ---------- */
#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  border-left:3px solid var(--gold);animation:tin .18s ease-out}
.toast.err{border-left-color:#E36A6A}
@keyframes tin{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 导入 ---------- */
.drop{border:2px dashed #CBD5E1;border-radius:14px;padding:28px;text-align:center;background:#FBFCFE;color:var(--muted)}
.drop.on{border-color:var(--gold);background:#FFFCF3}
.preview{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}
.preview table{width:100%;border-collapse:collapse;font-size:12px}
.preview th,.preview td{padding:6px 8px;border-bottom:1px solid #EEF1F6;text-align:left;white-space:nowrap}
.preview td.bad{background:#FFF6F6;color:var(--red)}
.codebox{background:#0E2438;color:#DCE6F0;border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,monospace;
  font-size:12px;overflow:auto;max-height:260px;white-space:pre}

/* ---------- 手机卡片 ---------- */
.mCards{display:flex;flex-direction:column;gap:10px}
.mCard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.mCard:active{background:#FFFCF3}
.mCard .mTop{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.mCard .mTop .rowSel{width:15px;height:15px;accent-color:var(--gold)}
.mCard .mAgent{margin-left:auto}
.mCard .mName{font-size:15px;font-weight:700;color:var(--navy);margin-top:7px;line-height:1.35}
.mCard .mMeta{font-size:12px;color:var(--muted);margin-top:3px}
.mCard .mPrice{font-family:Georgia,serif;font-size:17px;color:var(--navy);margin-top:6px}

/* ---------- 手机 ---------- */
@media (max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .kv{grid-template-columns:repeat(3,1fr)}
  .formGrid{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:236px;transform:translateX(-100%);transition:transform .2s}
  #side.on{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #burger{display:inline-block}
  #view{padding:14px 12px 50px}
  #top{padding:10px 12px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:1fr 1fr}
  .formGrid{grid-template-columns:1fr}
  .formGrid .span2,.formGrid .span3{grid-column:span 1}
  .grid2,.grid3{grid-template-columns:1fr}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toolbar input[type=search]{grid-column:1/-1;min-width:0;width:100%}
  .toolbar select,.toolbar input[type=text]{min-width:0;width:100%}
  .toolbar .count{grid-column:1/-1;text-align:right;margin:0}
  table.tbl{font-size:12px}
  table.tbl th,table.tbl td{padding:8px 7px}
  .dlg{width:100vw;max-height:100vh;height:100vh;margin:0;border-radius:0}
}
</style>
</head>
<body>

<div id="gate">
  <form class="gateCard" id="gateForm" autocomplete="on">
    <div class="lg">
      <img src="/icon-256.png" alt="KWONG THYE">
      <div><b>KWONG THYE</b><span>PropBase · 房产资料库</span></div>
    </div>
    <h1 id="gateTitle">登录资料库</h1>
    <p class="sub" id="gateSub">使用管理后台账号登录。房源、楼盘、业主、客户、带看与成交，一个地方管完。</p>
    <label for="gEmail" id="gEmailLabel">邮箱</label>
    <input id="gEmail" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="gPass" id="gPassLabel">密码</label>
    <input id="gPass" type="password" autocomplete="current-password" placeholder="••••••••">
    <label for="gCode" id="gCodeLabel" hidden>验证码（6 位）</label>
    <input id="gCode" type="text" inputmode="numeric" maxlength="6" hidden placeholder="123456">
    <div class="chk"><input id="gRemember" type="checkbox" checked><label for="gRemember" id="gRememberLabel" style="margin:0;font-weight:400">记住这台设备 7 天</label></div>
    <button class="btn gold" id="gBtn" type="submit">登录</button>
    <div class="gateMsg" id="gateMsg"></div>
    <div class="gateFoot">
      <span>© KWONG THYE · THE ROOF REALTY</span>
      <button type="button" id="gLang">EN</button>
    </div>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand">
      <img src="/icon-256.png" alt="">
      <div><b>KWONG THYE</b><span>PropBase</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="sideFoot">
      <span class="who" id="whoami">—</span>
      <span id="whoRole">—</span>
      <div class="btns">
        <button id="langBtn" type="button">EN</button>
        <button id="logoutBtn" type="button">退出</button>
      </div>
    </div>
  </aside>
  <div id="main">
    <header id="top">
      <button id="burger" type="button" aria-label="menu">☰</button>
      <div class="t"><h1 id="pageTitle">概览</h1><div class="sub" id="pageSub"></div></div>
      <div class="sp"></div>
      <div id="topActs" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </header>
    <section id="view"></section>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>
<script src="/library/app.js"></script>
</body>
</html>
