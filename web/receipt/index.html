<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>收据 / Receipt — KWONG THYE 光泰</title>
<link rel="icon" type="image/png" href="/icon-256.png">
<style>
  :root{--navy:#0E2438;--gold:#C6A15B;--cream:#F7F4EE;--ink:#1B2430;--muted:#5D6B7A;--line:#E4DED2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{width:min(720px,92vw);margin:0 auto}
  header{background:var(--navy);color:#fff;padding:18px 0}
  .bar{display:flex;align-items:center;gap:12px}
  .bar img{height:42px}
  .bar a.back{margin-left:auto;color:#D7E0EA;font-size:12.5px;text-decoration:none}
  #langBtn{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;
    padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  main{padding:34px 0 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px}
  h1{font-family:Georgia,"Songti SC",serif;color:var(--navy);font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:24px}
  .row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed #E9E3D7;font-size:14px}
  .row b{color:var(--navy);text-align:right}
  .amount{font-family:Georgia,serif;font-size:28px;color:var(--navy);margin:18px 0 4px}
  .muted{color:var(--muted);font-size:12px}
  .actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
  button,.btn{background:var(--navy);color:#fff;border:none;border-radius:999px;padding:10px 18px;font-size:13.5px;cursor:pointer;text-decoration:none;font-family:inherit}
  .btn.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
  .err{color:#B23B3B;font-size:14px}
  footer{padding:0 0 40px;color:var(--muted);font-size:11.5px;text-align:center}
  @media print{
    header,.actions,footer .noprint{display:none}
    body{background:#fff}
    .card{border:none;padding:0}
    main{padding:0}
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <img src="/logo-white.png" alt="KWONG THYE 光泰">
    <a class="back" href="/calc/" data-i18n="back">← 返回计算器</a>
    <button id="langBtn">EN</button>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="card" id="card">
      <h1 id="pageTitle">收据</h1>
      <div class="sub" data-i18n="brandLine">KWONG THYE 光泰 · kwongthye.com</div>
      <div id="body"><p class="muted" data-i18n="loading">加载中…</p></div>
    </div>
    <footer>
      <p class="noprint" data-i18n="autoNote">此收据由系统自动生成，无需签名。</p>
      <p class="noprint">KWONG THYE · Johor Bahru, Malaysia · andylau.theroof@gmail.com</p>
    </footer>
  </div>
</main>
<script>
(function () {
  "use strict";
  var I18N = {
    zh: {
      back: "← 返回计算器", loading: "加载中…", title: "收据",
      autoNote: "此收据由系统自动生成，无需签名。",
      no: "收据编号", date: "日期", billed: "客户", desc: "项目", valid: "有效期至", status: "状态",
      paid: "已付款", plan: "KWONG THYE 专业版", days: "天",
      payment: "付款方式：银行转账 / 开通码",
      pdf: "下载 PDF", print: "打印", pricing: "价格",
      auth: "请先登录后查看收据。", signin: "去登录",
      notfound: "找不到这张收据。", backBtn: "返回"
    },
    en: {
      back: "← Back to calculator", loading: "Loading…", title: "Receipt",
      autoNote: "This receipt is generated automatically and requires no signature.",
      no: "Receipt No.", date: "Date", billed: "Billed to", desc: "Description", valid: "Valid until", status: "Status",
      paid: "Paid", plan: "KWONG THYE Pro", days: "days",
      payment: "Payment: bank transfer / activation code",
      pdf: "Download PDF", print: "Print", pricing: "Pricing",
      auth: "Please sign in to view this receipt.", signin: "Sign in",
      notfound: "Receipt not found.", backBtn: "Back"
    }
  };
  var KEY = "kwongthye_lang";
  var lang = "zh";
  try { lang = localStorage.getItem(KEY) || localStorage.getItem("fangchan_lang") || "zh"; } catch (e) {}
  function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.zh[k] || k; }

  var id = new URLSearchParams(location.search).get("id");
  var body = document.getElementById("body");
  var lastState = null;

  function fmt(d) { return new Date(d).toLocaleDateString("en-MY", { year: "numeric", month: "short", day: "2-digit" }); }

  function render() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = (lang === "zh" ? "收据 Receipt" : "Receipt") + " — KWONG THYE";
    document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中文";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (I18N[lang][k]) el.textContent = I18N[lang][k];
    });
    document.getElementById("pageTitle").textContent = t("title");
    if (lastState === "loading") { body.innerHTML = '<p class="muted">' + t("loading") + "</p>"; }
    else if (lastState === "auth") {
      body.innerHTML = '<p class="err">' + t("auth") + "</p>" +
        '<div class="actions"><a class="btn" href="/calc/">' + t("signin") + "</a></div>";
    } else if (lastState === "notfound") {
      body.innerHTML = '<p class="err">' + t("notfound") + "</p>" +
        '<div class="actions"><a class="btn ghost" href="/calc/">' + t("backBtn") + "</a></div>";
    } else if (lastState && lastState.receipt) {
      var p = lastState.receipt, u = lastState.user;
      body.innerHTML =
        '<div class="row"><span>' + t("no") + "</span><b>" + p.receipt_no + "</b></div>" +
        '<div class="row"><span>' + t("date") + "</span><b>" + fmt(p.created_at) + "</b></div>" +
        '<div class="row"><span>' + t("billed") + "</span><b>" + (u && u.email || "") + "</b></div>" +
        '<div class="row"><span>' + t("desc") + "</span><b>" + t("plan") + " — " + p.days + " " + t("days") + "</b></div>" +
        (p.expires_after ? '<div class="row"><span>' + t("valid") + "</span><b>" + fmt(p.expires_after) + "</b></div>" : "") +
        '<div class="row"><span>' + t("status") + "</span><b>" + t("paid") + "</b></div>" +
        '<div class="amount">RM ' + Number(p.amount).toFixed(2) + "</div>" +
        '<div class="muted">' + t("payment") + "</div>" +
        '<div class="actions"><a class="btn" href="/api/payments/' + p.id + '/receipt.pdf">' + t("pdf") + "</a>" +
        '<button class="btn ghost" onclick="window.print()">' + t("print") + "</button>" +
        '<a class="btn ghost" href="/pricing/">' + t("pricing") + "</a></div>";
    }
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }

  document.getElementById("langBtn").addEventListener("click", function () {
    lang = lang === "zh" ? "en" : "zh";
    render();
  });

  lastState = "loading";
  render();

  fetch("/api/payments", { credentials: "same-origin" }).then(function (r) {
    if (r.status === 401) throw new Error("auth");
    return r.json();
  }).then(function (j) {
    var p = (j.payments || []).filter(function (x) { return x.id === id; })[0];
    if (!p) throw new Error("notfound");
    lastState = { receipt: p, user: j.user };
    render();
  }).catch(function (e) {
    lastState = e.message === "auth" ? "auth" : "notfound";
    render();
  });
})();
</script>
</body>
</html>
